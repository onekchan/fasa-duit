function Funds({ t, currency, fundsCol, categories, transactions, toastPush }) {
  const [editing, setEditing] = useState(null); // null | 'new' | {id...}

  const openNew = () => setEditing('new');
  const closeEditor = () => setEditing(null);

  const upsert = async (data) => {
    if (editing === 'new') {
      await fundsCol.add({
        ...data,
        contributions: [],
        created_at: new Date().toISOString().slice(0, 10),
      });
    } else if (editing) {
      await fundsCol.update(editing.id, data);
    }
    closeEditor();
  };

  const deleteFund = async (fund) => {
    if (!confirm(t.funds.confirmDelete)) return;
    await fundsCol.remove(fund.id);
    toastPush({
      message: t.funds.deletedToast,
      undoLabel: t.txn.undo,
      onUndo: () => fundsCol.restore(fund),
    });
  };

  const logContrib = async (fund, contrib) => {
    const next = [...(fund.contributions ?? []), contrib];
    await fundsCol.update(fund.id, { contributions: next });
  };
  const removeContrib = async (fund, idx) => {
    const next = (fund.contributions ?? []).filter((_, i) => i !== idx);
    await fundsCol.update(fund.id, { contributions: next });
  };

  // Totals across all funds
  const totals = useMemo(() => {
    let saved = 0, target = 0;
    for (const f of fundsCol.rows) {
      const s = computeFundState(f, transactions);
      saved  += s.saved_sen;
      target += f.target_sen ?? 0;
    }
    return { saved, target, count: fundsCol.rows.length };
  }, [fundsCol.rows, transactions]);

  const isEmpty = fundsCol.rows.length === 0 && !editing;

  return e(React.Fragment, null,
    e('div', { className: 'view-header' },
      e('h2', null, t.funds.title),
      e('div', { className: 'actions' },
        !editing && !isEmpty && e('button', { type: 'button', onClick: openNew }, t.funds.new),
      ),
    ),

    editing && e(FundEditor, {
      t, categories, currency,
      initial: editing === 'new' ? null : editing,
      onCancel: closeEditor,
      onSave: upsert,
    }),

    !editing && !isEmpty && e('div', { className: 'fund-totals' },
      e('div', { className: 'stat' },
        e('div', { className: 'label' }, t.funds.totals.totalSaved),
        e('div', { className: 'value' }, money.format(totals.saved, { currency })),
      ),
      e('div', { className: 'stat' },
        e('div', { className: 'label' }, t.funds.totals.totalTarget),
        e('div', { className: 'value' }, money.format(totals.target, { currency })),
      ),
      e('div', { className: 'stat' },
        e('div', { className: 'label' }, t.funds.totals.activeFunds),
        e('div', { className: 'value' }, String(totals.count)),
      ),
    ),

    isEmpty
      ? e('div', { className: 'card elevated empty' },
          e('svg', { className: 'illus', viewBox: '0 0 96 96', fill: 'none',
                     stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                     'aria-hidden': 'true' },
            e('path', { d: 'M64 30c6 0 12 5 12 12v22c0 6-5 12-12 12h-4l-4 10h-10l-4-10H30c-10 0-18-8-18-18s8-18 18-18h4c4-4 12-8 20-8m0 6c-4 0-8 4-8 8m-6 12h.05' }),
          ),
          e('h3', null, t.funds.empty.title),
          e('p', null, t.funds.empty.note),
          e('div', { className: 'empty-actions' },
            e('button', { type: 'button', onClick: openNew }, t.funds.empty.cta),
          ),
        )
      : e('div', { className: 'fund-list' },
          fundsCol.rows.map(f =>
            e(FundCard, {
              key: f.id, t, fund: f, transactions, categories, currency,
              onEdit: (fund) => setEditing(fund),
              onDelete: deleteFund,
              onLogContrib: (contrib) => logContrib(f, contrib),
              onRemoveContrib: removeContrib,
            })
          ),
        ),
  );
}

function Dashboard({ t, profile, transactions, categories, funds, onNav, onFilterLedger }) {
  const income = profile.income_sen ?? 0;
  const [needs_sen, wants_sen, savings_sen] = money.splitExact(income,
    [profile.split.needs, profile.split.wants, profile.split.savings]);

  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysLeft = daysInMonth - now.getDate();

  // Roll up current-month spend per bucket, using category→bucket lookup.
  const catBucket = useMemo(() =>
    Object.fromEntries(categories.map(c => [c.id, c.bucket])), [categories]);

  const spent = useMemo(() => {
    const ym = now.toISOString().slice(0, 7); // YYYY-MM
    const acc = { needs: 0, wants: 0, savings: 0 };
    for (const txn of transactions) {
      if (!txn.date || !txn.date.startsWith(ym)) continue;
      if (txn.amount_sen >= 0) continue; // ignore income for spend meters
      const bucket = catBucket[txn.category_id];
      if (!bucket || !(bucket in acc)) continue;
      acc[bucket] += Math.abs(txn.amount_sen);
    }
    return acc;
  }, [transactions, catBucket]);

  if (!income) {
    return e('div', { className: 'card elevated' },
      e('h2', null, t.dashboard.title),
      e('p', { className: 'muted' }, t.empty.dashboard),
      e('div', { style: { marginTop: 16 } },
        e('button', { onClick: () => onNav('settings') }, t.cta.setIncome)
      )
    );
  }

  // First off-pace / not-done fund → gentle nudge on the dashboard.
  const nudge = useMemo(() => {
    for (const f of (funds ?? [])) {
      const s = computeFundState(f, transactions);
      if (!s.done && s.required_monthly_sen > 0) {
        return { fund: f, amount_sen: s.required_monthly_sen, icon: f.icon };
      }
    }
    return null;
  }, [funds, transactions]);

  return e('div', { className: 'grid' },
    e('div', { className: 'card elevated' },
      e('h2', null, t.dashboard.title),
      e(Meter, { label: t.dashboard.needs,   spent_sen: spent.needs,   budget_sen: needs_sen,   daysLeft, t }),
      e(Meter, { label: t.dashboard.wants,   spent_sen: spent.wants,   budget_sen: wants_sen,   daysLeft, t }),
      e(Meter, { label: t.dashboard.savings, spent_sen: spent.savings, budget_sen: savings_sen, daysLeft, t }),
      e('p', { className: 'muted', style: { marginTop: 12 } },
        `${daysLeft} ${t.dashboard.daysLeft}`
      )
    ),
    nudge && e('div', {
      className: 'fund-nudge', role: 'button', tabIndex: 0,
      onClick: () => onNav('funds'),
      onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onNav('funds'); } },
      style: { cursor: 'pointer' },
    },
      e('div', { className: 'icon-wrap' }, e(FundIcon, { name: nudge.icon })),
      e('div', { className: 'text' },
        e('div', { className: 'name' }, nudge.fund.name),
        e('div', { className: 'msg' },
          fmt(t.funds.dashboardNudge, {
            amount: money.format(nudge.amount_sen, { currency: profile.currency }),
            name: nudge.fund.name,
          })
        ),
      ),
    ),
    e(ExpenseDistribution, {
      t, currency: profile.currency,
      transactions, categories,
      onFilterLedger,
    }),
  );
}

/* =========================================================================
 * OnboardingWizard — 4 steps. Income required, everything else skippable.
 * ========================================================================= */
function OnboardingWizard({ t, profile, updateProfile, categoriesCol, accountsCol, onDone, onSkipSession }) {
  const w = t.wizard;
  const [step, setStep] = useState(1);
  const total = 4;

  // Step 1 — income (draft in RM string, parsed to sen on Next/Finish)
  const [incomeStr, setIncomeStr] = useState(
    profile.income_sen ? (profile.income_sen / 100).toFixed(2) : ''
  );
  const income_sen = money.parse(incomeStr);
  const incomeValid = income_sen != null && income_sen > 0;
  const [incomeError, setIncomeError] = useState('');

  // Step 2 — currency
  const [currency, setCurrency] = useState(profile.currency ?? 'MYR');

  // Step 3 — accounts: presets keyed by name → { selected, balance_str }
  const [presetState, setPresetState] = useState({});
  const [customAccounts, setCustomAccounts] = useState([]); // [{name, balance_str}]
  const [customDraft, setCustomDraft] = useState('');

  const togglePreset = (name) => {
    setPresetState((s) => {
      const cur = s[name] ?? { selected: false, balance_str: '' };
      return { ...s, [name]: { ...cur, selected: !cur.selected } };
    });
  };
  const setPresetBalance = (name, v) => {
    setPresetState((s) => {
      const cur = s[name] ?? { selected: true, balance_str: '' };
      return { ...s, [name]: { ...cur, selected: true, balance_str: v } };
    });
  };
  const addCustom = () => {
    const name = customDraft.trim();
    if (!name) return;
    setCustomAccounts((a) => [...a, { name, balance_str: '' }]);
    setCustomDraft('');
  };
  const setCustomBalance = (idx, v) => {
    setCustomAccounts((a) => a.map((x, i) => i === idx ? { ...x, balance_str: v } : x));
  };
  const removeCustom = (idx) => {
    setCustomAccounts((a) => a.filter((_, i) => i !== idx));
  };

  // Category preview groups (from DEFAULTS.categoriesSeed)
  const catsByBucket = useMemo(() => ({
    needs:   DEFAULTS.categoriesSeed.filter(c => c.bucket === 'needs'),
    wants:   DEFAULTS.categoriesSeed.filter(c => c.bucket === 'wants'),
    savings: DEFAULTS.categoriesSeed.filter(c => c.bucket === 'savings'),
  }), []);

  const goNext = () => {
    if (step === 1) {
      if (!incomeValid) { setIncomeError(w.incomeRequired); return; }
      setIncomeError('');
      updateProfile({ income_sen });
    }
    if (step === 2) updateProfile({ currency });
    setStep((s) => Math.min(total, s + 1));
  };
  const goBack = () => setStep((s) => Math.max(1, s - 1));

  const finish = async () => {
    // Persist income + currency once more just in case Next wasn't clicked.
    if (incomeValid) updateProfile({ income_sen });
    updateProfile({ currency });

    // Write chosen accounts — through the collection hook so React state
    // (which Settings reads from) stays in sync with the db.
    const chosen = [
      ...Object.entries(presetState)
        .filter(([, v]) => v.selected)
        .map(([name, v]) => {
          const preset = ACCOUNT_PRESETS.find(p => p.name === name);
          return {
            name,
            type: preset?.type ?? 'cash',
            institution: name,
            opening_balance_sen: money.parse(v.balance_str) ?? 0,
            currency,
            archived: false,
          };
        }),
      ...customAccounts.map(a => ({
        name: a.name,
        type: 'cash',
        institution: '',
        opening_balance_sen: money.parse(a.balance_str) ?? 0,
        currency,
        archived: false,
      })),
    ];
    for (const acct of chosen) {
      await accountsCol.add(acct);
    }

    // Seed categories via the hook, but only when the collection is empty —
    // otherwise a re-run of the wizard would double-seed.
    if (categoriesCol.rows.length === 0) {
      for (const cat of DEFAULTS.categoriesSeed) {
        await categoriesCol.add({ ...cat, archived: false });
      }
    }

    updateProfile({ onboarding_done: true });
    onDone();
  };

  const stepDot = (i) =>
    e('div', {
      key: i, className: 'dot' + (i < step ? ' done' : i === step ? ' current' : ''),
      'aria-current': i === step ? 'step' : undefined,
    });

  const bodyByStep = () => {
    if (step === 1) return e(React.Fragment, null,
      e('div', { className: 'step-label' }, w.step1Label),
      e('h1', null, w.step1Title),
      e('p', { className: 'subhead' }, w.step1Sub),
      e('div', { className: 'field' },
        e('label', { htmlFor: 'wiz-income' }, w.incomeLabel),
        e('div', { className: 'money-input' },
          e('span', { className: 'prefix' }, currencySymbol(currency)),
          e('input', {
            id: 'wiz-income', type: 'text', inputMode: 'decimal',
            placeholder: '5,000.00', value: incomeStr,
            onChange: (ev) => { setIncomeStr(ev.target.value); if (incomeError) setIncomeError(''); },
            onBlur: () => {
              if (incomeValid) setIncomeStr((income_sen / 100).toFixed(2));
            },
            'aria-invalid': !!incomeError,
          }),
        ),
        e('div', { className: 'hint' + (incomeError ? ' ' : '') , style: incomeError ? { color: 'var(--danger)' } : null },
          incomeError || w.incomeHint
        )
      )
    );

    if (step === 2) return e(React.Fragment, null,
      e('div', { className: 'step-label' }, w.step2Label),
      e('h1', null, w.step2Title),
      e('p', { className: 'subhead' }, w.step2Sub),
      e('div', { className: 'field' },
        e('label', { htmlFor: 'wiz-currency' }, w.currencyLabel),
        e('select', {
          id: 'wiz-currency', value: currency,
          onChange: (ev) => setCurrency(ev.target.value),
        }, CURRENCIES.map(c => e('option', { key: c.code, value: c.code }, c.label)))
      )
    );

    if (step === 3) {
      const sym = currencySymbol(currency);
      const selectedNames = Object.entries(presetState).filter(([, v]) => v.selected).map(([n]) => n);
      return e(React.Fragment, null,
        e('div', { className: 'step-label' }, w.step3Label),
        e('h1', null, w.step3Title),
        e('p', { className: 'subhead' }, w.step3Sub),
        e('div', { className: 'chips' },
          ACCOUNT_PRESETS.map(p =>
            e('button', {
              key: p.name, type: 'button',
              className: 'chip' + ((presetState[p.name]?.selected) ? ' selected' : ''),
              'aria-pressed': !!presetState[p.name]?.selected,
              onClick: () => togglePreset(p.name),
            }, p.name)
          )
        ),
        (selectedNames.length > 0 || customAccounts.length > 0) && e('div', { className: 'accounts-list' },
          selectedNames.map(name =>
            e('div', { key: name, className: 'row' },
              e('span', { className: 'name' }, name),
              e('label', { className: 'balance-input', 'aria-label': w.openingBalance + ' ' + name },
                e('span', { className: 'prefix' }, sym),
                e('input', {
                  type: 'text', inputMode: 'decimal',
                  placeholder: '0.00',
                  value: presetState[name]?.balance_str ?? '',
                  onChange: (ev) => setPresetBalance(name, ev.target.value),
                })
              ),
              e('button', {
                type: 'button', className: 'remove',
                'aria-label': 'Remove ' + name,
                onClick: () => togglePreset(name),
              }, '×')
            )
          ),
          customAccounts.map((a, i) =>
            e('div', { key: 'custom_' + i, className: 'row' },
              e('span', { className: 'name' }, a.name),
              e('label', { className: 'balance-input', 'aria-label': w.openingBalance + ' ' + a.name },
                e('span', { className: 'prefix' }, sym),
                e('input', {
                  type: 'text', inputMode: 'decimal',
                  placeholder: '0.00',
                  value: a.balance_str,
                  onChange: (ev) => setCustomBalance(i, ev.target.value),
                })
              ),
              e('button', {
                type: 'button', className: 'remove',
                'aria-label': 'Remove ' + a.name,
                onClick: () => removeCustom(i),
              }, '×')
            )
          ),
        ),
        e('div', { className: 'field', style: { marginTop: 20 } },
          e('label', { htmlFor: 'wiz-custom' }, w.addCustom),
          e('div', { style: { display: 'grid', gridTemplateColumns: '1fr auto', gap: 8 } },
            e('input', {
              id: 'wiz-custom', type: 'text',
              placeholder: w.customName, value: customDraft,
              onChange: (ev) => setCustomDraft(ev.target.value),
              onKeyDown: (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); addCustom(); } },
            }),
            e('button', { className: 'ghost', type: 'button', onClick: addCustom }, '+')
          )
        )
      );
    }

    // step 4
    const total_cats =
      catsByBucket.needs.length + catsByBucket.wants.length + catsByBucket.savings.length;
    return e(React.Fragment, null,
      e('div', { className: 'step-label' }, w.step4Label),
      e('h1', null, w.step4Title),
      e('p', { className: 'subhead' }, w.step4Sub),
      e('div', { style: { marginBottom: 16 } },
        e('span', { className: 'muted' }, fmt(w.catCount, { n: total_cats }))
      ),
      e('div', { className: 'cat-preview' },
        ['needs', 'wants', 'savings'].map(b =>
          e('div', { key: b, className: 'bucket-col' },
            e('h4', null,
              e('span', { className: 'bucket-badge ' + b }, w.buckets[b])
            ),
            e('ul', null, catsByBucket[b].map(c => e('li', { key: c.name }, c.name)))
          )
        )
      )
    );
  };

  return e('div', { className: 'card elevated wiz', role: 'dialog', 'aria-labelledby': 'wiz-heading' },
    e('div', { className: 'steps', 'aria-hidden': 'true' },
      [1, 2, 3, 4].map(stepDot)
    ),
    bodyByStep(),
    e('div', { className: 'actions' },
      e('button', { className: 'skip', type: 'button', onClick: onSkipSession }, w.skip),
      e('div', { className: 'right' },
        step > 1 && e('button', { className: 'ghost', type: 'button', onClick: goBack }, w.back),
        step < total
          ? e('button', { type: 'button', onClick: goNext }, w.next)
          : e('button', { type: 'button', onClick: finish }, w.finish)
      )
    )
  );
}

function currencySymbol(code) {
  return ({
    MYR: 'RM', SGD: 'S$', USD: '$', AUD: 'A$', GBP: '£', EUR: '€',
    IDR: 'Rp', THB: '฿', PHP: '₱', JPY: '¥',
  })[code] ?? code;
}

/* =========================================================================
 * QuickAdd — slide-down transaction row. Opens on `n`, Enter saves & reopens,
 * Esc closes. Amount defaults to Expense; toggle flips to Income.
 * ========================================================================= */
function QuickAdd({ t, categories, accounts, onSave, onClose, currency }) {
  const [type, setType] = useState('expense'); // 'expense' | 'income'
  const [amount, setAmount] = useState('');
  const [categoryId, setCategoryId] = useState('');
  const [accountId, setAccountId] = useState(accounts[0]?.id ?? '');
  const [merchant, setMerchant] = useState('');
  const amountRef = React.useRef(null);

  useEffect(() => {
    // Autofocus amount on open; move focus back after save.
    amountRef.current?.focus();
  }, []);

  // Category options: income only if type=income, else non-income buckets.
  const catOptions = useMemo(() => {
    return categories.filter(c => !c.archived);
  }, [categories]);

  const save = () => {
    const sen = money.parse(amount);
    if (sen == null || sen === 0) { amountRef.current?.focus(); return; }
    const signed = type === 'income' ? Math.abs(sen) : -Math.abs(sen);
    onSave({
      date: new Date().toISOString().slice(0, 10),
      account_id: accountId || null,
      category_id: categoryId || null,
      amount_sen: signed,
      merchant: merchant.trim(),
      notes: '',
      tags: [],
    });
    // Reopen for next entry — clear amount + merchant, keep others.
    setAmount(''); setMerchant('');
    amountRef.current?.focus();
  };

  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); onClose(); }
  };

  const sym = currencySymbol(currency);
  return e('div', { className: 'quickadd', onKeyDown: onKey, role: 'form', 'aria-label': t.txn.quickAdd },
    e('div', { className: 'qa-row' },
      e('div', { className: 'type-toggle', role: 'group', 'aria-label': t.txn.amount },
        e('button', {
          type: 'button',
          className: 'expense' + (type === 'expense' ? ' active' : ''),
          onClick: () => setType('expense'),
        }, '−'),
        e('button', {
          type: 'button',
          className: 'income' + (type === 'income' ? ' active' : ''),
          onClick: () => setType('income'),
        }, '+')
      ),
      e('input', {
        ref: amountRef, className: 'amount',
        type: 'text', inputMode: 'decimal',
        placeholder: sym + ' 0.00',
        value: amount, onChange: (ev) => setAmount(ev.target.value),
        'aria-label': t.txn.amount,
      }),
      e('select', {
        value: categoryId, onChange: (ev) => setCategoryId(ev.target.value),
        'aria-label': t.txn.category,
      },
        e('option', { value: '' }, t.txn.chooseCategory),
        catOptions.map(c => e('option', { key: c.id, value: c.id }, c.name))
      ),
      e('select', {
        value: accountId, onChange: (ev) => setAccountId(ev.target.value),
        'aria-label': t.txn.account,
      },
        e('option', { value: '' }, t.txn.chooseAccount),
        accounts.filter(a => !a.archived).map(a => e('option', { key: a.id, value: a.id }, a.name))
      ),
      e('input', {
        className: 'merchant',
        type: 'text', placeholder: t.txn.merchant,
        value: merchant, onChange: (ev) => setMerchant(ev.target.value),
        'aria-label': t.txn.merchant,
      }),
      e('button', { className: 'save-btn', type: 'button', onClick: save }, t.txn.quickAdd),
      e('button', { className: 'ghost close-btn', type: 'button', onClick: onClose, 'aria-label': t.txn.close }, '×'),
    ),
    e('div', { className: 'esc-hint' }, t.txn.escHint),
  );
}

/* =========================================================================
 * Transactions view — toolbar, ledger table, empty state, sample loader
 * ========================================================================= */
function Transactions({
  t, currency, transactions, categories, accounts,
  quickAddOpen, onOpenQuickAdd, onCloseQuickAdd,
  onSave, onDelete, onLoadSample, toastPush, searchRef,
  ledgerFilter,
}) {
  const [query, setQuery] = useState('');
  const [accountFilter, setAccountFilter] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo,   setDateTo]   = useState('');

  // When dashboard chart clicks pass in a filter, seed the local state.
  // `ts` (timestamp on the incoming filter) forces re-apply even if the values
  // are the same as last click.
  useEffect(() => {
    if (!ledgerFilter) return;
    setQuery(ledgerFilter.merchant ?? '');
    setCategoryFilter(ledgerFilter.categoryId ?? '');
    setDateFrom(ledgerFilter.range?.from ?? '');
    setDateTo(ledgerFilter.range?.to ?? '');
  }, [ledgerFilter?.ts]);

  const catById = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories]);
  const accById = useMemo(() => Object.fromEntries(accounts.map(a => [a.id, a])), [accounts]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return transactions
      .filter(txn => !accountFilter || txn.account_id === accountFilter)
      .filter(txn => !categoryFilter || txn.category_id === categoryFilter)
      .filter(txn => !dateFrom || (txn.date && txn.date >= dateFrom))
      .filter(txn => !dateTo   || (txn.date && txn.date <= dateTo))
      .filter(txn => {
        if (!q) return true;
        const merch = (txn.merchant || '').toLowerCase();
        const notes = (txn.notes || '').toLowerCase();
        const tags = (txn.tags || []).join(' ').toLowerCase();
        return merch.includes(q) || notes.includes(q) || tags.includes(q);
      })
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }, [transactions, query, accountFilter, categoryFilter, dateFrom, dateTo]);

  const del = (txn) => {
    onDelete(txn.id);
    toastPush({
      message: t.txn.deletedToast,
      undoLabel: t.txn.undo,
      onUndo: () => onSave(txn, txn.id),
      durationMs: 5000,
    });
  };

  const isEmpty = transactions.length === 0;

  return e(React.Fragment, null,
    e('div', { className: 'view-header' },
      e('h2', null, t.txn.title),
      e('div', { className: 'actions' },
        !quickAddOpen && e('button', { type: 'button', onClick: onOpenQuickAdd }, '+ ' + t.txn.quickAdd),
      ),
    ),

    quickAddOpen && e(QuickAdd, {
      t, categories, accounts, currency,
      onSave: (data) => onSave(data),
      onClose: onCloseQuickAdd,
    }),

    !isEmpty && e('div', { className: 'ledger-toolbar' },
      e('input', {
        type: 'search', placeholder: t.txn.searchPlaceholder,
        value: query, onChange: (ev) => setQuery(ev.target.value),
        ref: searchRef,
        'aria-label': t.txn.searchPlaceholder,
      }),
      e('select', {
        value: accountFilter, onChange: (ev) => setAccountFilter(ev.target.value),
        'aria-label': t.txn.filterAll,
      },
        e('option', { value: '' }, t.txn.filterAll),
        accounts.map(a => e('option', { key: a.id, value: a.id }, a.name))
      ),
      e('select', {
        value: categoryFilter, onChange: (ev) => setCategoryFilter(ev.target.value),
        'aria-label': t.txn.filterCatAll,
      },
        e('option', { value: '' }, t.txn.filterCatAll),
        categories.map(c => e('option', { key: c.id, value: c.id }, c.name))
      ),
      e('div', { className: 'spacer' }),
      (accountFilter || categoryFilter || query || dateFrom || dateTo) && e('button', {
        className: 'ghost', type: 'button', style: { padding: '6px 10px' },
        onClick: () => { setQuery(''); setAccountFilter(''); setCategoryFilter(''); setDateFrom(''); setDateTo(''); },
      }, 'Clear filters'),
      e('span', { className: 'muted' }, fmt(t.txn.count, { n: filtered.length })),
    ),

    isEmpty
      ? e('div', { className: 'card elevated empty' },
          e('svg', { className: 'illus', viewBox: '0 0 96 96', fill: 'none',
                     stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                     'aria-hidden': 'true' },
            e('path', { d: 'M14 30h68v52a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V30z' }),
            e('path', { d: 'M14 30l6-14a4 4 0 0 1 3.6-2.3h48.8A4 4 0 0 1 76 16l6 14' }),
            e('path', { d: 'M30 46h36M30 58h24' }),
          ),
          e('h3', null, t.txn.emptyTitle),
          e('p', null, t.txn.emptyNote),
          e('div', { className: 'empty-actions' },
            e('button', { type: 'button', onClick: onOpenQuickAdd }, t.txn.addFirst),
            e('button', { className: 'ghost', type: 'button', onClick: onLoadSample }, t.txn.addSample),
          )
        )
      : e('div', { className: 'ledger-table' },
          e('table', null,
            e('thead', null,
              e('tr', null,
                e('th', null, t.txn.dateCol),
                e('th', null, t.txn.merchantCol),
                e('th', null, t.txn.categoryCol),
                e('th', null, t.txn.accountCol),
                e('th', { style: { textAlign: 'right' } }, t.txn.amountCol),
                e('th', { 'aria-label': '' }),
              )
            ),
            e('tbody', null,
              filtered.map((txn) => {
                const income = txn.amount_sen > 0;
                return e('tr', { key: txn.id },
                  e('td', null, formatDate(txn.date, profileLangFromDoc())),
                  e('td', null, txn.merchant || '—',
                    (txn.tags || []).includes('sample') && e('span', {
                      className: 'sample-tag', style: { marginLeft: 8 },
                    }, t.txn.sampleBadge),
                  ),
                  e('td', null, catById[txn.category_id]?.name ?? '—'),
                  e('td', null, accById[txn.account_id]?.name ?? '—'),
                  e('td', { className: 'amt ' + (income ? 'income' : 'expense') },
                    (income ? '+' : '') + money.format(txn.amount_sen, { currency, showSymbol: true })
                  ),
                  e('td', null,
                    e('button', {
                      className: 'del-btn', type: 'button',
                      'aria-label': 'Delete transaction',
                      onClick: () => del(txn),
                    }, '×')
                  )
                );
              })
            )
          )
        )
  );
}

// DD/MM/YYYY per the brief (both languages).
function formatDate(iso /* YYYY-MM-DD */) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
// Placeholder — the language isn't needed for date formatting per the brief,
// but keeping the seam in case we localize weekday names later.
function profileLangFromDoc() { return document.documentElement.lang || 'en'; }

/* =========================================================================
 * Settings — three panels: Profile & budget, Categories, Accounts
 * ========================================================================= */
function Settings({ t, profile, updateProfile, categoriesCol, accountsCol }) {
  return e('div', { className: 'settings-stack' },
    e('h2', null, t.settings.title),
    e(ProfilePanel, { t, profile, updateProfile }),
    e(CategoriesPanel, { t, col: categoriesCol }),
    e(AccountsPanel, { t, col: accountsCol, currency: profile.currency }),
  );
}

/* ---------- Profile & budget ---------- */
function ProfilePanel({ t, profile, updateProfile }) {
  const p = t.settings.profile;
  const [incomeStr, setIncomeStr] = useState(
    profile.income_sen ? (profile.income_sen / 100).toFixed(2) : ''
  );
  // Split as three strings while editing, validated on blur / Save.
  const [needsStr,   setNeedsStr]   = useState(String(profile.split.needs));
  const [wantsStr,   setWantsStr]   = useState(String(profile.split.wants));
  const [savingsStr, setSavingsStr] = useState(String(profile.split.savings));

  // Keep local state in sync if profile changes elsewhere.
  useEffect(() => {
    setNeedsStr(String(profile.split.needs));
    setWantsStr(String(profile.split.wants));
    setSavingsStr(String(profile.split.savings));
  }, [profile.split.needs, profile.split.wants, profile.split.savings]);

  const needsN   = Number(needsStr);
  const wantsN   = Number(wantsStr);
  const savingsN = Number(savingsStr);
  const parts = [needsN, wantsN, savingsN];
  const anyNaN = parts.some(n => !Number.isFinite(n) || n < 0);
  const total = anyNaN ? NaN : needsN + wantsN + savingsN;
  const splitValid = !anyNaN && total === 100;

  const commitIncome = () => {
    const sen = money.parse(incomeStr);
    if (sen != null && sen >= 0 && sen !== profile.income_sen) {
      updateProfile({ income_sen: sen });
    }
    // Reformat the displayed value.
    if (sen != null) setIncomeStr((sen / 100).toFixed(2));
  };
  const commitSplit = () => {
    if (!splitValid) return;
    updateProfile({ split: { needs: needsN, wants: wantsN, savings: savingsN } });
  };

  const sym = currencySymbol(profile.currency);

  return e('div', { className: 'card elevated settings-section' },
    e('h3', null, p.title),
    e('p', { className: 'section-sub' }, p.sub),

    // Income
    e('div', { className: 'setting-row' },
      e('div', { className: 'label-col' },
        e('div', { className: 'name' }, p.income),
        e('div', { className: 'hint' }, p.incomeHint),
      ),
      e('div', { className: 'money-input', style: { minWidth: 220 } },
        e('span', { className: 'prefix' }, sym),
        e('input', {
          type: 'text', inputMode: 'decimal',
          value: incomeStr,
          onChange: (ev) => setIncomeStr(ev.target.value),
          onBlur: commitIncome,
          onKeyDown: (ev) => { if (ev.key === 'Enter') { ev.currentTarget.blur(); } },
          'aria-label': p.income,
        }),
      ),
    ),

    // Split — three inputs
    e('div', { className: 'setting-row', style: { display: 'block' } },
      e('div', { className: 'label-col' },
        e('div', { className: 'name' }, p.split),
        e('div', { className: 'hint' }, p.splitHint),
      ),
      e('div', { className: 'split-grid', style: { marginTop: 12 } },
        e(SplitInput, { label: p.needs,   value: needsStr,   onChange: setNeedsStr }),
        e(SplitInput, { label: p.wants,   value: wantsStr,   onChange: setWantsStr }),
        e(SplitInput, { label: p.savings, value: savingsStr, onChange: setSavingsStr }),
      ),
      e('div', { className: 'split-status' },
        splitValid
          ? e('span', { className: 'ok' }, '✓ ' + p.splitOk)
          : e('span', { className: total > 100 ? 'over' : 'off' },
              fmt(p.splitOff, { n: anyNaN ? '?' : total })
            ),
        e('button', {
          type: 'button', style: { marginLeft: 'auto' },
          disabled: !splitValid, onClick: commitSplit,
        }, 'Save split'),
      ),
    ),

    // Currency
    e('div', { className: 'setting-row' },
      e('div', { className: 'label-col' },
        e('div', { className: 'name' }, p.currency),
      ),
      e('select', {
        value: profile.currency,
        onChange: (ev) => updateProfile({ currency: ev.target.value }),
      }, CURRENCIES.map(c => e('option', { key: c.code, value: c.code }, c.label))),
    ),

    // Language
    e('div', { className: 'setting-row' },
      e('div', { className: 'label-col' },
        e('div', { className: 'name' }, p.language),
      ),
      e('div', { className: 'seg-toggle' },
        ['en', 'ms'].map(k =>
          e('button', {
            key: k, type: 'button',
            className: profile.language === k ? 'active' : '',
            onClick: () => updateProfile({ language: k }),

        )
      ),
    ),

    // Theme
    e('div', { className: 'setting-row' },
      e('div', { className: 'label-col' },
        e('div', { className: 'name' }, p.theme),
      ),
      e('div', { className: 'seg-toggle' },

            className: profile.theme === k ? 'active' : '',

  );
}

/* ---------- /#debug/math route ---------- */
function DebugMath() {
  const results = useMemo(() => runMathAssertions(), []);
  const passed = results.filter(r => r.pass).length;
  return e('div', { className: 'card elevated debug-math' },
    e('h2', null, `Math regression — ${passed}/${results.length} passing`),
    e('ol', null, results.map((r, i) =>
      e('li', { key: i, className: r.pass ? 'pass' : 'fail' },
        `${r.pass ? '✔' : '✘'} ${r.name}${r.pass ? '' : ` — got ${JSON.stringify(r.got)}, want ${JSON.stringify(r.want)}`}`
      )
    ))
  );
}

function runMathAssertions() {
  const R = [];
  const eq = (name, got, want) => R.push({ name, got, want, pass: JSON.stringify(got) === JSON.stringify(want) });

  // format
  eq('format 0 sen',           money.format(0),            'RM 0.00');
  eq('format 100 sen',         money.format(100),          'RM 1.00');
  eq('format 123456 sen',      money.format(123456),       'RM 1,234.56');
  eq('format -50 sen',         money.format(-50),          '-RM 0.50');
  eq('format 100000000',       money.format(100000000),    'RM 1,000,000.00');

  // parse
  eq('parse RM 1,234.56',      money.parse('RM 1,234.56'), 123456);
  eq('parse 1234.56',          money.parse('1234.56'),     123456);
  eq('parse empty → null',     money.parse(''),            null);
  eq('parse garbage → null',   money.parse('abc'),         null);

  // banker's rounding
  eq('bankers 0.5 → 0',        money.bankersRound(0.5),    0);
  eq('bankers 1.5 → 2',        money.bankersRound(1.5),    2);
  eq('bankers 2.5 → 2',        money.bankersRound(2.5),    2);
  eq('bankers 3.5 → 4',        money.bankersRound(3.5),    4);
  eq('bankers 2.4 → 2',        money.bankersRound(2.4),    2);
  eq('bankers 2.6 → 3',        money.bankersRound(2.6),    3);

  // add / subtract
  eq('add 33+33+33=99',        money.add(33, 33, 33),      99);
  eq('subtract',               money.subtract(100, 25),    75);

  // percent (basis points)
  eq('10% of 10000 sen',       money.percent(10000, 1000), 1000);
  eq('12.34% of 100000',       money.percent(100000, 1234), 1234);

  // splitExact — sum invariant
  const s = money.splitExact(100000, [50, 30, 20]);
  eq('split 1000RM 50/30/20 sums exactly', s.reduce((a,b)=>a+b,0), 100000);
  eq('split 1000RM 50/30/20 shape',        s.length,               3);
  const s2 = money.splitExact(100003, [50, 30, 20]); // odd income → remainder into largest
  eq('split 1000.03 sum invariant',        s2.reduce((a,b)=>a+b,0), 100003);
  eq('split 1000.03 remainder → needs',    s2[0] > Math.floor(100003 * 50 / 100), true);

  // custom split (60/20/20)
  const s3 = money.splitExact(500099, [60, 20, 20]);
  eq('split 5000.99 60/20/20 sums exactly', s3.reduce((a,b)=>a+b,0), 500099);

  // Debt monthly payment formula (RM 10,000 at 18% APR over 12 months)
  // M = P r (1+r)^n / ((1+r)^n − 1); r = 0.18/12 = 0.015; n = 12
  // Expected ≈ RM 916.80  → 91680 sen (allow ±2 sen)
  const monthly_sen = amortMonthly_sen(1000000, 1800 /* apr_bps */, 12);
  eq('amort 10k@18%/12mo ≈ 916.80', Math.abs(monthly_sen - 91680) <= 2, true);

  // Amortization total = principal + interest, all months
  const sched = amortSchedule_sen(1000000, 1800, 12);
  const paid = sched.reduce((a, r) => a + r.payment_sen, 0);
  eq('amort 12mo total payments > principal', paid > 1000000, true);
  eq('amort 12mo final balance ≈ 0',          Math.abs(sched[sched.length - 1].balance_after_sen) <= 1, true);

  // Sinking fund required contribution: 5000 RM in 10 months → 500 RM/mo exact
  eq('sinking 5000/10 = 500',      sinkingRequiredMonthly_sen(500000, 10), 50000);
  // 5001 RM in 10 → ceil to 500.10
  eq('sinking 5001/10 ceils',      sinkingRequiredMonthly_sen(500100, 10), 50010);

  return R;
}

/* =========================================================================
 * Debt math — monthly payment + amortization schedule (integer sen)
 * ========================================================================= */
function amortMonthly_sen(principal_sen, apr_bps, months) {
  const r = (apr_bps / 10000) / 12; // periodic rate
  if (r === 0) return money.bankersRound(principal_sen / months);
  const factor = Math.pow(1 + r, months);
  const M = principal_sen * r * factor / (factor - 1);
  return money.bankersRound(M);
}

function amortSchedule_sen(principal_sen, apr_bps, months, extra_sen = 0) {
  const r = (apr_bps / 10000) / 12;
  const M = amortMonthly_sen(principal_sen, apr_bps, months) + extra_sen;
  const rows = [];
  let bal = principal_sen;
  for (let i = 1; i <= months && bal > 0; i++) {
    const interest_sen = money.bankersRound(bal * r);
    let principalPaid = M - interest_sen;
    if (principalPaid > bal) principalPaid = bal;
    const payment = principalPaid + interest_sen;
    bal -= principalPaid;
    rows.push({ month: i, payment_sen: payment, interest_sen, principal_sen: principalPaid, balance_after_sen: bal });
  }
  return rows;
}

function sinkingRequiredMonthly_sen(remaining_sen, months_remaining) {
  if (months_remaining <= 0) return remaining_sen;
  return Math.ceil(remaining_sen / months_remaining);
}

/* =========================================================================
 * Root component
 * ========================================================================= */
function App() {
  const [profile, updateProfile] = useProfile();
  useTheme(profile);
  const [route, setRoute] = useRoute();
  const t = STRINGS[profile.language] ?? STRINGS.en;

  // Onboarding gate — declared early so `nav` can dismiss it on any sidebar click.
  const [skippedThisSession, setSkippedThisSession] = useState(false);

  const nav = useCallback((k) => {
    // If the wizard is still up, any nav click means "I want to explore" —
    // dismiss the wizard for this session so the destination is actually visible.
    if (!profile.onboarding_done) setSkippedThisSession(true);
    setRoute(k);
  }, [profile.onboarding_done, setRoute]);

  // Collections
  const categoriesCol   = useCollection('categories');
  const accountsCol     = useCollection('accounts');
  const transactionsCol = useCollection('transactions');
  const fundsCol        = useCollection('sinking_funds');
  const debtsCol        = useCollection('debts');

  // Toasts (undo, etc.)
  const { toasts, push: toastPush, dismiss: toastDismiss } = useToasts();

  // Wizard is visible until finished OR skipped for this session.
  // Also only shown on the dashboard route so users can freely explore other tabs.
  const showWizard =
    !profile.onboarding_done && !skippedThisSession &&
    (route === 'dashboard' || route === '') &&
    route !== 'debug/math';

  // Sidebar visibility (session-scoped for now).
  const [sidebarHiddenUser, setSidebarHiddenUser] = useState(false);
  // Hidden if the user collapsed it, OR while the wizard is up.
  const sidebarHidden = sidebarHiddenUser || showWizard;
  const toggleSidebar = () => setSidebarHiddenUser(v => !v);

  // Ledger filter set by dashboard chart clicks — Transactions seeds its own
  // filter state from this when the value bumps.
  const [ledgerFilter, setLedgerFilter] = useState(null);
  const applyLedgerFilter = useCallback((flt) => {
    setLedgerFilter({ ...flt, ts: Date.now() });
    nav('transactions');
  }, [nav]);

  // Quick-add is a global overlay so `n` (or the topbar +) can open it from anywhere.
  const [quickAddOpen, setQuickAddOpen] = useState(false);
  const openQuickAdd = useCallback(() => {
    // If onboarding is still up, treat the click as "I want to start using it now"
    // and dismiss the wizard for this session so the quick-add row is actually visible.
    if (!profile.onboarding_done) setSkippedThisSession(true);
    if (route !== 'transactions') setRoute('transactions');
    setQuickAddOpen(true);
  }, [route, profile.onboarding_done, setRoute]);
  const closeQuickAdd = useCallback(() => setQuickAddOpen(false), []);

  // Search field ref for `/` shortcut
  const searchRef = React.useRef(null);

  // Keyboard shortcuts
  useEffect(() => {
    let pending = null, pendingUntil = 0;
    const handler = (ev) => {
      const el = ev.target;
      const inField = el && /INPUT|TEXTAREA|SELECT/.test(el.tagName);
      const now = Date.now();
      // `g` chord
      if (pending === 'g' && now < pendingUntil && !inField) {
        pending = null;
        const map = { d: 'dashboard', t: 'transactions', f: 'funds', x: 'debts', s: 'settings' };
        if (map[ev.key]) { nav(map[ev.key]); ev.preventDefault(); }
        return;
      }
      if (inField) return; // don't hijack typing
      if (ev.key === 'g') { pending = 'g'; pendingUntil = now + 800; return; }
      if (ev.key === 'n') { ev.preventDefault(); openQuickAdd(); }
      else if (ev.key === '/') {
        ev.preventDefault();
        if (route !== 'transactions') setRoute('transactions');
        setTimeout(() => searchRef.current?.focus(), 30);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [openQuickAdd, route, nav, setRoute]);

  // Save handler used by QuickAdd + undo. If `id` is supplied, restore the row.
  const saveTxn = async (data, restoreId) => {
    if (restoreId) {
      await transactionsCol.restore({ id: restoreId, ...data });
    } else {
      await transactionsCol.add(data);
    }
  };
  const deleteTxn = async (id) => transactionsCol.remove(id);

  // Load sample month using seeded categories + accounts as name→id maps.
  const loadSampleMonth = async () => {
    const catsByName = Object.fromEntries(categoriesCol.rows.map(c => [c.name, c]));
    const accsByName = Object.fromEntries(accountsCol.rows.map(a => [a.name, a]));
    const rows = makeSampleMonth(catsByName, accsByName);
    for (const r of rows) await transactionsCol.add(r);
  };

  const view = (() => {
    if (showWizard) {
      return e(OnboardingWizard, {
        t, profile, updateProfile,
        categoriesCol, accountsCol,
        onDone: () => { nav('dashboard'); },
        onSkipSession: () => setSkippedThisSession(true),
      });
    }
    if (route === 'debug/math') return e(DebugMath);
    if (route === 'transactions') return e(Transactions, {
      t, currency: profile.currency,
      transactions: transactionsCol.rows,
      categories: categoriesCol.rows,
      accounts: accountsCol.rows,
      quickAddOpen, onOpenQuickAdd: openQuickAdd, onCloseQuickAdd: closeQuickAdd,
      onSave: saveTxn, onDelete: deleteTxn,
      onLoadSample: loadSampleMonth,
      toastPush, searchRef,
      ledgerFilter,
    });
    if (route === 'funds')    return e(Funds, {
      t, currency: profile.currency,
      fundsCol, categories: categoriesCol.rows,
      transactions: transactionsCol.rows,
      toastPush,
    });
    if (route === 'debts')    return e(Debts, {
      t, currency: profile.currency,
      profile, updateProfile,
      debtsCol, toastPush,
    });
    if (route === 'settings') return e(Settings, {
      t, profile, updateProfile,
      categoriesCol, accountsCol,
    });
    return e(Dashboard, {
      t, profile, onNav: nav,
      transactions: transactionsCol.rows,
      categories: categoriesCol.rows,
      funds: fundsCol.rows,
      onFilterLedger: applyLedgerFilter,
    });
  })();

  // Portal the toasts into the fixed-position region declared in the HTML shell.
  const toastRegion = document.getElementById('toast-region');
  const toastNode = toastRegion
    ? ReactDOM.createPortal(e(ToastRegion, { toasts, dismiss: toastDismiss }), toastRegion)
    : null;

  return e(React.Fragment, null,
    e('div', { className: 'shell' + (sidebarHidden ? ' no-sidebar' : '') },
      !sidebarHidden && e(Sidebar, { t, route, onNav: nav, onHide: toggleSidebar }),
      e('main', { className: 'main' },
        e('div', { className: 'main-inner' },
          e(TopBar, {
            t, lang: profile.language,
            onLang: (v) => updateProfile({ language: v }),
            onQuickAdd: openQuickAdd,
            showQuickAdd: !showWizard,
            onToggleSidebar: toggleSidebar,
            sidebarHidden,
            // The manual toggle only makes sense once onboarding lets the sidebar exist.
            showSidebarToggle: !showWizard,
          }),
          view,
        )
      ),
      // Bottom tab bar is CSS-hidden above 720px, so we still render it —
      // but only when the wizard isn't up.
      !showWizard && e(BottomNav, { t, route, onNav: nav }),
    ),
    toastNode,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

/* Keyboard shortcuts (n, /, g-chord) are wired inside App via useEffect. */
</script>
