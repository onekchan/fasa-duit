  the harness wraps it in <!doctype html><html><head>…</head><body>, so we do
  NOT include those tags here. Put <title>, <style>, and the app markup at the
  top of the file directly.

  Runtime capabilities used (declared at publish time via Artifact `capabilities`):
    - db    : per-user private subtree under data/users/me/…
    - user  : Claude account sign-in; `me` resolves to the current user id

  BEFORE first publish: load the `artifact-capabilities` skill and wire the real
  db/user calls into the stubs marked TODO(capabilities) below.

<title>FASA Duit</title>

<!-- Google Fonts: warm serif for display + humanist sans for body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- Design tokens (light) ---------- */
  :root {
    --bg:        #FBF6EE;
    --surface:   #FFFFFF;
    --card:      #F5EBDA;
    --ink:       #3E2A1F;
    --muted:     #7A6B5F;
    --brand:     #C8553D;
    --accent:    #6B8E5A;
    --warning:   #D98E3A;
    --danger:    #A03E2F;
    --divider:   #E8DCC7;
    --focus:     #C8553D;

    --shadow-sm: 0 1px 2px rgba(62,42,31,.06);
    --shadow-md: 0 1px 2px rgba(62,42,31,.06), 0 8px 24px rgba(62,42,31,.06);

    --radius:    18px;
    --radius-sm: 10px;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body:    "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    color-scheme: light;
  }

  /* ---------- Design tokens (dark) ---------- */
  /* Redefined in BOTH blocks so the manual toggle wins in either OS setting. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #1F1712;
      --surface: #241B15;
      --card:    #2A211B;
      --ink:     #F5EBDA;
      --muted:   #B8A897;
      --brand:   #E07A64;
      --accent:  #8FB37A;
      --warning: #E8A85A;
      --danger:  #C86454;
      --divider: #3A2E24;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:      #1F1712;
    --surface: #241B15;
    --card:    #2A211B;
    --ink:     #F5EBDA;
    --muted:   #B8A897;
    --brand:   #E07A64;
    --accent:  #8FB37A;
    --warning: #E8A85A;
    --danger:  #C86454;
    --divider: #3A2E24;
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 4px; }
  h2 { font-size: 20px; line-height: 1.2; margin: 0 0 12px; }
  h3 { font-size: 16px; line-height: 1.25; margin: 0 0 8px; }
  p  { margin: 0 0 8px; color: var(--ink); }
  .muted { color: var(--muted); }

  a, button { color: inherit; font: inherit; }
  button {
    background: var(--brand); color: #FFF6EC; border: 0; border-radius: var(--radius-sm);
    padding: 10px 16px; cursor: pointer; font-weight: 600;
    transition: filter 150ms ease, transform 150ms ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--divider); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .card.elevated { box-shadow: var(--shadow-md); background: var(--surface); }

  /* ---------- Shell layout: sidebar + main ---------- */
  .shell {
    min-height: 100vh;
    /* 180px sidebar + 24px gutter — the gutter shows the page bg between
       the rail and the content cards so the two never look joined. */
    padding-left: 204px;
    transition: padding-left 200ms ease;
  }
  .shell.no-sidebar { padding-left: 0; }
  .sidebar {
    /* Edge-to-edge rail flush with the viewport top/left/bottom. */
    position: fixed; top: 0; left: 0;
    width: 180px; height: 100vh;
    padding: 22px 14px;
    background: var(--card);
    border-right: 1px solid var(--divider);
    display: flex; flex-direction: column; gap: 18px;
    /* Subtle right-side elevation — reads as a lifted rail without a floating card look */
    box-shadow: 4px 0 20px rgba(62,42,31,.05);
    /* Long menus scroll inside the rail without pushing anything else */
    overflow-y: auto;
    z-index: 10;
  }
  /* Dark-mode shadow: warmer + a touch stronger so the rail still lifts */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sidebar {
      box-shadow: 4px 0 24px rgba(0,0,0,.30);
    }
  }
  :root[data-theme="dark"] .sidebar {
    box-shadow: 4px 0 24px rgba(0,0,0,.30);
  }
  .sidebar .brand-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 4px 8px;
  }
  .sidebar .brand {
    font-family: var(--font-display); font-weight: 700; font-size: 22px;
    color: var(--brand); letter-spacing: -0.01em;
  }
  .sidebar .hide-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--divider); border-radius: 8px;
    padding: 6px; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; cursor: pointer;
    transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
  }
  .sidebar .hide-btn:hover {
    color: var(--ink); background: var(--surface); border-color: var(--brand);
  }
  .sidebar .hide-btn svg { width: 15px; height: 15px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav button {
    background: transparent; color: var(--muted);
    padding: 10px 12px; border-radius: var(--radius-sm);
    font-weight: 500; text-align: left; width: 100%;
    transition: background 150ms ease, color 150ms ease;
  }
  .sidebar nav button:hover { background: var(--surface); color: var(--ink); }
  .sidebar nav button.active {
    background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .main {
    /* Fill the remaining width so `main` stretches all the way to the
       right edge of the viewport regardless of the wrapper's intrinsic size.
       Inside, `.main > *` still enjoys the same comfortable measure via the
       max-width on its wrapper below. */
    min-width: 0;
    width: 100%;
    padding: 24px 28px 40px;
    box-sizing: border-box;
  }
  .main-inner {
    max-width: 1120px;
    margin: 0 auto;
  }

  /* Top bar inside main: sidebar toggle on the left, actions on the right */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px;
  }
  .topbar .left, .topbar .right {
    display: flex; align-items: center; gap: 8px;
  }
  .topbar .brand-inline {
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    color: var(--brand); letter-spacing: -0.01em; margin-left: 4px;
  }
  /* Mobile brand is only for viewports where the sidebar is CSS-hidden. Above
     the mobile breakpoint the sidebar carries the brand, so hide the duplicate. */
  .topbar .brand-mobile { display: none; }
  .icon-btn.ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--divider);
  }
  .icon-btn.ghost:hover { background: var(--card); }

  /* ---------- Mobile: hide sidebar, use bottom tab bar ---------- */
  .bottomnav { display: none; }
  @media (max-width: 720px) {
    .shell { padding-left: 0; }
    .sidebar { display: none; }
    .main { padding: 16px 14px 88px; }
    .topbar {
      justify-content: space-between;
    }
    .topbar .brand-mobile {
      display: block;
      font-family: var(--font-display); font-weight: 700; font-size: 20px;
      color: var(--brand); letter-spacing: -0.01em;
    }
    .bottomnav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around;
      background: var(--surface); border-top: 1px solid var(--divider);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .bottomnav button {
      background: transparent; color: var(--muted); padding: 8px 10px;
      font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .bottomnav button.active { color: var(--brand); }
  }

  /* ---------- Layout helpers ---------- */
  .grid { display: grid; gap: 16px; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 720px) {
    .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
  }

  /* ---------- Meter (50/30/20) ---------- */
  .meter { margin: 12px 0; }
  .meter .track {
    background: var(--divider); border-radius: 999px; height: 10px; overflow: hidden;
  }
  .meter .fill {
    height: 100%; border-radius: 999px; background: var(--accent);
    transition: width 200ms ease, background 200ms ease;
  }
  .meter.over .fill { background: var(--danger); }
  .meter .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .meter .row .lbl { font-weight: 600; }
  .meter .row .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

  /* Numbers everywhere are tabular for clean vertical alignment */
  .num, .amount { font-variant-numeric: tabular-nums; }

  /* Debug harness */
  .debug-math { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .debug-math .pass { color: var(--accent); }
  .debug-math .fail { color: var(--danger); font-weight: 700; }

  /* Toast area */
  .toast-region {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 30;
    pointer-events: none;
  }
  .toast {
    background: var(--ink); color: var(--bg); padding: 10px 14px;
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    pointer-events: auto; font-size: 14px;
  }

  /* Prevent horizontal scroll — use `clip` (not `hidden`) so `position: sticky`
     descendants (like the left sidebar) still stick to the viewport instead of
     scrolling with the page. */
  html, body { overflow-x: clip; }
  body { margin: 0; }

  /* ---------- Onboarding wizard ---------- */
  .wiz { max-width: 640px; margin: 8px auto 0; }
  .wiz .steps {
    display: flex; gap: 6px; margin-bottom: 20px;
  }
  .wiz .steps .dot {
    flex: 1; height: 6px; border-radius: 999px;
    background: var(--divider); transition: background 200ms ease;
  }
  .wiz .steps .dot.done { background: var(--accent); }
  .wiz .steps .dot.current { background: var(--brand); }
  .wiz .step-label {
    color: var(--muted); font-size: 13px; font-weight: 500;
    margin-bottom: 4px; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .wiz h1 { margin-bottom: 8px; }
  .wiz .subhead { color: var(--muted); margin-bottom: 24px; }
  .wiz .actions {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-top: 28px;
  }
  .wiz .actions .right { display: flex; gap: 10px; }
  .wiz .skip {
    background: transparent; color: var(--muted); padding: 8px 4px;
    font-weight: 500; text-decoration: underline; text-underline-offset: 3px;
  }
  .wiz .skip:hover { color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-weight: 600; font-size: 14px; }
  .field .hint { color: var(--muted); font-size: 13px; }
  .field input, .field select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: var(--radius-sm);
    padding: 12px 14px; font: inherit; font-variant-numeric: tabular-nums;
    transition: border-color 150ms ease;
  }
  .field input:focus, .field select:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.15); }
  .money-input {
    display: grid; grid-template-columns: auto 1fr; align-items: stretch;
    border: 1px solid var(--divider); border-radius: var(--radius-sm); overflow: hidden;
    background: var(--surface);
  }
  .money-input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.15); }
  .money-input .prefix {
    display: flex; align-items: center; padding: 0 12px;
    background: var(--card); color: var(--muted); font-weight: 600;
    border-right: 1px solid var(--divider);
  }
  .money-input input { border: 0; box-shadow: none; }

  .chips {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 150ms ease;
  }
  .chip:hover { border-color: var(--brand); }
  .chip.selected {
    background: var(--brand); color: #FFF6EC; border-color: var(--brand);
  }

  .accounts-list {
    display: flex; flex-direction: column; gap: 8px; margin-top: 16px;
  }
  .accounts-list .row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius-sm); padding: 10px 12px;
  }
  .accounts-list .row .name { font-weight: 500; }
  .accounts-list .row .balance-input {
    display: grid; grid-template-columns: auto 1fr;
    border: 1px solid var(--divider); border-radius: var(--radius-sm); overflow: hidden;
    background: var(--bg); width: 160px;
  }
  .accounts-list .row .balance-input .prefix {
    padding: 6px 8px; background: var(--card); color: var(--muted);
    font-size: 13px; border-right: 1px solid var(--divider);
  }
  .accounts-list .row .balance-input input {
    border: 0; padding: 6px 8px; font-size: 14px; background: transparent; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .accounts-list .row .remove {
    background: transparent; color: var(--muted); padding: 4px 8px;
    font-size: 18px; line-height: 1;
  }
  .accounts-list .row .remove:hover { color: var(--danger); }

  .cat-preview {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
  }
  @media (max-width: 720px) { .cat-preview { grid-template-columns: 1fr; } }
  .cat-preview .bucket-col h4 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted); font-family: var(--font-body);
  }
  .cat-preview .bucket-col ul {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 14px;
  }
  .cat-preview .bucket-col li { color: var(--ink); }
  .bucket-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .bucket-badge.needs   { background: rgba(107, 142, 90, 0.15); color: var(--accent); }
  .bucket-badge.wants   { background: rgba(217, 142, 58, 0.18); color: var(--warning); }
  .bucket-badge.savings { background: rgba(200, 85, 61, 0.15); color: var(--brand); }

  /* ---------- Quick-add slide-down ---------- */
  .quickadd {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    animation: slideDown 180ms ease;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .quickadd .qa-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;
  }
  /* Sensible min-widths + flex growth so fields share space and wrap gracefully */
  .quickadd .qa-row .type-toggle { flex: 0 0 auto; }
  .quickadd .qa-row .amount      { flex: 1 1 140px; min-width: 130px; }
  .quickadd .qa-row select       { flex: 1 1 160px; min-width: 130px; }
  .quickadd .qa-row .merchant    { flex: 2 1 200px; min-width: 160px; }
  .quickadd .qa-row .save-btn    { flex: 0 0 auto; }
  .quickadd .qa-row .close-btn   { flex: 0 0 auto; }
  @media (max-width: 720px) {
    .quickadd .qa-row .amount,
    .quickadd .qa-row select,
    .quickadd .qa-row .merchant { flex-basis: 100%; }
  }
  .quickadd .type-toggle {
    display: inline-flex; background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .quickadd .type-toggle button {
    background: transparent; color: var(--muted); padding: 0 12px;
    font-size: 13px; font-weight: 600; border-radius: 0;
  }
  .quickadd .type-toggle button.active { color: var(--ink); background: var(--card); }
  .quickadd .type-toggle button.active.expense { color: var(--brand); }
  .quickadd .type-toggle button.active.income  { color: var(--accent); }
  .quickadd input, .quickadd select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: var(--radius-sm);
    padding: 10px 12px; font: inherit; font-variant-numeric: tabular-nums;
  }
  .quickadd input:focus, .quickadd select:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.15);
  }
  .quickadd .amount { text-align: right; }
  .quickadd .esc-hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .quickadd .esc-hint kbd {
    background: var(--surface); border: 1px solid var(--divider); border-radius: 4px;
    padding: 1px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--ink);
  }

  /* ---------- Transactions ledger ---------- */
  .ledger-toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
  }
  .ledger-toolbar input[type="search"], .ledger-toolbar select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: var(--radius-sm);
    padding: 8px 12px; font: inherit;
  }
  .ledger-toolbar input[type="search"] { min-width: 220px; flex: 1; }
  .ledger-toolbar .spacer { flex: 1; }

  .ledger-table { overflow-x: auto; border-radius: var(--radius); }
  .ledger-table table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--divider); border-radius: var(--radius);
  }
  .ledger-table th, .ledger-table td {
    padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }
  .ledger-table th {
    color: var(--muted); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--card);
  }
  .ledger-table tr:last-child td { border-bottom: 0; }
  .ledger-table td.amt {
    text-align: right; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .ledger-table td.amt.expense { color: var(--ink); }
  .ledger-table td.amt.income  { color: var(--accent); }
  .ledger-table tr:hover td { background: var(--card); }
  .ledger-table .del-btn {
    background: transparent; color: var(--muted); padding: 4px 8px;
    font-size: 16px;
  }
  .ledger-table .del-btn:hover { color: var(--danger); }
  .ledger-table td.sample-tag {
    color: var(--muted); font-size: 11px; letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .empty {
    text-align: center; padding: 48px 20px;
  }
  .empty .illus {
    width: 96px; height: 96px; margin: 0 auto 16px;
    color: var(--muted); opacity: 0.7;
  }
  .empty h3 { margin-bottom: 6px; }
  .empty p  { color: var(--muted); margin-bottom: 20px; }
  .empty .empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .toast .undo-btn {
    margin-left: 12px; background: transparent; color: var(--brand);
    padding: 0; text-decoration: underline; text-underline-offset: 3px;
    font-weight: 600; font-size: 14px;
  }

  /* ---------- Icon button + tooltip ---------- */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0;
    background: var(--brand); color: #FFF6EC;
    border: 0; border-radius: var(--radius-sm);
    cursor: pointer; transition: filter 150ms ease, transform 150ms ease;
  }
  .icon-btn:hover { filter: brightness(1.05); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 18px; height: 18px; }

  .tip { position: relative; display: inline-flex; }
  .tip::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--ink); color: var(--bg);
    padding: 6px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 150ms ease, transform 150ms ease;
    z-index: 40;
    box-shadow: var(--shadow-md);
  }
  .tip::before {
    content: ''; position: absolute; top: calc(100% + 3px); right: 14px;
    border: 5px solid transparent; border-bottom-color: var(--ink);
    opacity: 0; transition: opacity 150ms ease;
    z-index: 41;
  }
  .tip:hover::after, .tip:focus-within::after,
  .tip:hover::before, .tip:focus-within::before {
    opacity: 1; transform: translateY(0);
  }
  .tip kbd {
    background: rgba(255,255,255,0.15); border-radius: 4px;
    padding: 0 5px; margin-left: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }

  /* Section header row (Transactions view) */
  .view-header {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;
    gap: 12px; flex-wrap: wrap;
  }
  .view-header h2 { margin-bottom: 0; }
  .view-header .actions { display: flex; gap: 8px; }

  /* ---------- Settings ---------- */
  .settings-stack { display: flex; flex-direction: column; gap: 16px; }
  .settings-section { padding: 24px; }
  .settings-section h3 { margin-bottom: 4px; }
  .settings-section .section-sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .split-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  @media (max-width: 720px) { .split-grid { grid-template-columns: 1fr; } }
  .split-status {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    font-size: 13px;
  }
  .split-status .ok      { color: var(--accent); font-weight: 600; }
  .split-status .off     { color: var(--warning); font-weight: 600; }
  .split-status .over    { color: var(--danger); font-weight: 600; }

  .seg-toggle {
    display: inline-flex; background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius-sm); overflow: hidden; padding: 3px;
    gap: 2px;
  }
  .seg-toggle button {
    background: transparent; color: var(--muted); padding: 6px 12px;
    font-size: 13px; font-weight: 600; border-radius: calc(var(--radius-sm) - 3px);
  }
  .seg-toggle button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }

  .mgr-list { display: flex; flex-direction: column; gap: 6px; }
  .mgr-bucket-header {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 0 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--divider);
  }
  .mgr-bucket-header:first-child { margin-top: 0; }
  .mgr-bucket-header h4 {
    margin: 0; font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted); font-family: var(--font-body);
    font-weight: 600;
  }
  .mgr-bucket-header .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  .mgr-row {
    display: grid; grid-template-columns: 1fr auto auto auto;
    gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius-sm); padding: 8px 12px;
  }
  .mgr-row.archived { opacity: 0.55; }
  .mgr-row input[type="text"] {
    background: transparent; color: var(--ink); border: 0;
    padding: 4px 0; font: inherit; font-weight: 500;
    min-width: 0;
  }
  .mgr-row input[type="text"]:focus {
    outline: none;
    background: var(--bg); border-radius: 4px; padding: 4px 8px;
  }
  .mgr-row .bucket-pick,
  .mgr-row .type-pick {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--divider); border-radius: 6px;
    padding: 4px 8px; font-size: 13px;
  }
  .mgr-row .balance-cell {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg); border: 1px solid var(--divider); border-radius: 6px;
    padding: 2px 8px;
  }
  .mgr-row .balance-cell .prefix {
    color: var(--muted); font-size: 12px; font-weight: 600;
  }
  .mgr-row .balance-cell input {
    background: transparent; border: 0; padding: 4px 0;
    font: inherit; font-variant-numeric: tabular-nums;
    width: 90px; text-align: right;
  }
  .mgr-row .balance-cell input:focus { outline: none; }
  .mgr-row .icon-mini {
    background: transparent; color: var(--muted); padding: 6px;
    border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
  }
  .mgr-row .icon-mini:hover { background: var(--card); color: var(--ink); }
  .mgr-row .icon-mini.danger:hover { color: var(--danger); background: var(--card); }
  .mgr-row .icon-mini svg { width: 15px; height: 15px; }

  .add-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 12px;
    background: var(--card); border: 1px dashed var(--divider);
    border-radius: var(--radius-sm); padding: 10px 12px;
  }
  .add-row input, .add-row select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: 6px;
    padding: 6px 10px; font: inherit;
  }
  .add-row input:focus, .add-row select:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.15);
  }

  .setting-row {
    display: grid; grid-template-columns: 1fr auto; gap: 20px;
    align-items: center; padding: 12px 0;
    border-top: 1px solid var(--divider);
  }
  .setting-row:first-child { border-top: 0; padding-top: 0; }
  .setting-row .label-col .name { font-weight: 600; }
  .setting-row .label-col .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
  /* ---------- Debts ---------- */
  .debts-hero {
    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
    margin-bottom: 16px;
  }
  .debts-hero .totals-inline {
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  .debts-hero .totals-inline .kv .k {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .debts-hero .totals-inline .kv .v {
    font-family: var(--font-display); font-weight: 600; font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .strategy-primer {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .strategy-primer h4 {
    margin: 0 0 6px; font-family: var(--font-display); font-size: 15px; color: var(--ink);
  }
  .strategy-primer p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .strategy-primer .grid2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 720px) { .strategy-primer .grid2 { grid-template-columns: 1fr; } }
  .strategy-primer .grid2 .col .badge {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px;
  }
  .strategy-primer .grid2 .col.snowball .badge { background: rgba(107,142,90,0.18); color: var(--accent); }
  .strategy-primer .grid2 .col.avalanche .badge { background: rgba(200,85,61,0.15); color: var(--brand); }

  .extra-slider {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .extra-slider .row1 {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .extra-slider .row1 .title {
    font-weight: 600; font-size: 15px; color: var(--ink);
  }
  .extra-slider .row1 .hint { color: var(--muted); font-size: 13px; }
  .extra-slider .row2 { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  @media (max-width: 720px) { .extra-slider .row2 { grid-template-columns: 1fr; } }

  .extra-slider input[type="range"] {
    width: 100%;
    -webkit-appearance: none; appearance: none;
    background: transparent;
  }
  .extra-slider input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; background: var(--divider); border-radius: 999px;
  }
  .extra-slider input[type="range"]::-moz-range-track {
    height: 6px; background: var(--divider); border-radius: 999px;
  }
  .extra-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--brand); border: 2px solid var(--surface);
    box-shadow: var(--shadow-sm);
    margin-top: -7px; cursor: pointer;
  }
  .extra-slider input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--brand); border: 2px solid var(--surface);
    box-shadow: var(--shadow-sm); cursor: pointer;
  }
  .extra-slider .amount-cell {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius-sm);
    padding: 2px 10px;
  }
  .extra-slider .amount-cell .prefix { color: var(--muted); font-weight: 600; }
  .extra-slider .amount-cell input {
    background: transparent; border: 0; padding: 8px 4px;
    width: 100px; text-align: right; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  .extra-slider .amount-cell input:focus { outline: none; }

  .strategy-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
  }
  @media (max-width: 900px) { .strategy-grid { grid-template-columns: 1fr; } }
  .strategy-card { padding: 20px; position: relative; }
  .strategy-card.winner { border-color: var(--brand); box-shadow: 0 1px 2px rgba(200,85,61,.08), 0 12px 32px rgba(200,85,61,.08); }
  .strategy-card .head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .strategy-card .head .title {
    font-family: var(--font-display); font-weight: 600; font-size: 18px;
    color: var(--ink); margin: 0;
  }
  .strategy-card .head .winner-pill {
    margin-left: auto; padding: 3px 10px; border-radius: 999px;
    background: var(--brand); color: #FFF6EC; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .strategy-card .head .badge {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .strategy-card .head .badge.snowball { background: rgba(107,142,90,0.18); color: var(--accent); }
  .strategy-card .head .badge.avalanche { background: rgba(200,85,61,0.15); color: var(--brand); }

  .strategy-card .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-top: 10px;
  }
  .strategy-card .stats .k {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600; margin-bottom: 3px;
  }
  .strategy-card .stats .v {
    font-family: var(--font-display); font-weight: 600; font-size: 18px;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }

  .savings-callout {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px;
    display: flex; gap: 12px; align-items: center;
  }
  .savings-callout .amt {
    font-family: var(--font-display); font-weight: 700;
    color: var(--brand); font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .savings-callout .msg { color: var(--muted); font-size: 14px; flex: 1; }

  .debt-list { display: flex; flex-direction: column; gap: 12px; }
  .debt-row {
    background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .debt-row .head {
    display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 12px; align-items: center;
  }
  @media (max-width: 720px) {
    .debt-row .head { grid-template-columns: 1fr auto; row-gap: 8px; }
    .debt-row .head > .val { grid-column: span 2; }
  }
  .debt-row .name { font-weight: 600; font-size: 15px; }
  .debt-row .type { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .debt-row .val { text-align: right; font-variant-numeric: tabular-nums; }
  .debt-row .val .k {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600; margin-bottom: 2px;
  }
  .debt-row .val .v { font-weight: 600; }
  .debt-row .actions { display: flex; gap: 4px; }

  .amort-toggle {
    background: transparent; color: var(--brand); padding: 4px 0;
    font-size: 13px; font-weight: 600; margin-top: 10px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .amort-toggle:hover { text-decoration: underline; text-underline-offset: 3px; }

  .amort-table {
    margin-top: 12px; overflow-x: auto;
    background: var(--bg); border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
  }
  .amort-table table { width: 100%; border-collapse: collapse; }
  .amort-table th, .amort-table td {
    padding: 8px 12px; text-align: right; font-size: 13px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--divider);
  }
  .amort-table th:first-child, .amort-table td:first-child { text-align: left; }
  .amort-table th {
    color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--card);
  }
  .amort-table tr:last-child td { border-bottom: 0; }
  .amort-table .gap-row td {
    background: var(--card); color: var(--muted); text-align: center; font-size: 12px;
  }

  /* Debt editor uses same class family as fund editor */
  .debt-editor .fe-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .debt-editor .fe-row { grid-template-columns: 1fr; } }
  .debt-editor .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

  /* ---------- Sinking funds ---------- */
  .fund-totals {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) { .fund-totals { grid-template-columns: 1fr; } }
  .fund-totals .stat {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .fund-totals .stat .label {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 600; margin-bottom: 6px;
  }
  .fund-totals .stat .value {
    font-family: var(--font-display); font-weight: 600; font-size: 22px;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }

  .fund-list { display: grid; gap: 16px; grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .fund-list { grid-template-columns: 1fr; } }

  .fund-card { padding: 20px; }
  .fund-card .head {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px;
  }
  .fund-card .head .icon-wrap {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
    color: var(--brand); flex-shrink: 0;
  }
  .fund-card .head .icon-wrap svg { width: 20px; height: 20px; }
  .fund-card .head .name {
    font-family: var(--font-display); font-weight: 600; font-size: 18px;
    color: var(--ink); margin: 0;
  }
  .fund-card .head .meta {
    color: var(--muted); font-size: 13px; margin-top: 2px;
  }
  .fund-card .head .actions {
    margin-left: auto; display: flex; gap: 4px;
  }
  .fund-card .head .actions .icon-mini svg { width: 16px; height: 16px; }

  .fund-card .progress-track {
    background: var(--divider); border-radius: 999px; height: 8px; overflow: hidden;
    margin: 12px 0 8px;
  }
  .fund-card .progress-fill {
    height: 100%; border-radius: 999px; background: var(--accent);
    transition: width 250ms ease, background 200ms ease;
  }
  .fund-card.status-behind .progress-fill { background: var(--warning); }
  .fund-card.status-ahead .progress-fill  { background: var(--accent); }
  .fund-card.status-done .progress-fill   { background: var(--accent); }

  .fund-card .amounts {
    display: flex; justify-content: space-between; align-items: baseline;
    font-variant-numeric: tabular-nums;
  }
  .fund-card .amounts .saved  { font-weight: 700; color: var(--ink); }
  .fund-card .amounts .target { color: var(--muted); font-size: 13px; }

  .fund-card .stats-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--divider);
  }
  .fund-card .stats-row .stat .lbl {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600; margin-bottom: 4px;
  }
  .fund-card .stats-row .stat .val {
    font-weight: 600; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums;
  }

  .fund-card .footer {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .fund-card .footer .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .fund-card .footer .status-badge.ontrack { background: rgba(107,142,90,0.15); color: var(--accent); }
  .fund-card .footer .status-badge.behind  { background: rgba(217,142,58,0.18); color: var(--warning); }
  .fund-card .footer .status-badge.ahead   { background: rgba(107,142,90,0.15); color: var(--accent); }
  .fund-card .footer .status-badge.done    { background: rgba(200,85,61,0.15);  color: var(--brand); }
  .fund-card .footer .push-right { margin-left: auto; }

  .contrib-log {
    margin-top: 14px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
  }
  .contrib-log h5 {
    margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); font-weight: 600;
  }
  .contrib-log ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .contrib-log li {
    display: flex; justify-content: space-between; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .contrib-log li .date { color: var(--muted); }
  .contrib-log li .del {
    background: transparent; color: var(--muted); padding: 0 6px; margin-left: 8px;
  }
  .contrib-log li .del:hover { color: var(--danger); }
  .contrib-log .add-contrib {
    display: grid; grid-template-columns: 1fr auto auto; gap: 6px; margin-top: 10px;
  }
  .contrib-log .add-contrib input {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-variant-numeric: tabular-nums;
  }
  .contrib-log .add-contrib input:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(200,85,61,0.15);
  }

  /* Fund editor (inline card at top of Funds view) */
  .fund-editor { padding: 20px; }
  .fund-editor .fe-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 720px) { .fund-editor .fe-row { grid-template-columns: 1fr; } }
  .fund-editor .icon-picker {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .fund-editor .icon-picker .icon-opt {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--divider);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer;
    transition: all 150ms ease;
  }
  .fund-editor .icon-picker .icon-opt:hover { color: var(--ink); border-color: var(--brand); }
  .fund-editor .icon-picker .icon-opt.selected {
    background: var(--brand); color: #FFF6EC; border-color: var(--brand);
  }
  .fund-editor .icon-picker .icon-opt svg {
    width: 18px; height: 18px;
    flex-shrink: 0; display: block;
  }

  .fund-editor .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

  /* Dashboard sinking-fund nudge */
  .fund-nudge {
    background: var(--card); border: 1px solid var(--divider);
    border-radius: var(--radius); padding: 16px 18px;
    display: flex; gap: 14px; align-items: center;
  }
  .fund-nudge .icon-wrap {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
    color: var(--brand); flex-shrink: 0;
  }
  .fund-nudge .icon-wrap svg { width: 18px; height: 18px; }
  .fund-nudge .text { flex: 1; }
  .fund-nudge .text .name { font-weight: 600; color: var(--ink); }
  .fund-nudge .text .msg { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---------- Expense distribution (dashboard) ---------- */
  .dist-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .dist-grid { grid-template-columns: 1fr; } }

  .range-toggle {
    display: inline-flex; background: var(--surface); border: 1px solid var(--divider);
    border-radius: var(--radius-sm); padding: 3px; gap: 2px;
    flex-wrap: wrap;
  }
  .range-toggle button {
    background: transparent; color: var(--muted); padding: 6px 10px;
    font-size: 13px; font-weight: 600;
    border-radius: calc(var(--radius-sm) - 3px);
  }
  .range-toggle button.active {
    background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm);
  }

  .donut-wrap { position: relative; height: 260px; }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
  }
  .donut-center .total {
    font-family: var(--font-display); font-weight: 600; font-size: 24px;

<script>
/* =========================================================================
 * money.js — integer sen arithmetic + formatting
 * All monetary values are integers in sen (1 RM = 100 sen).
 * Never use JS floats for money. Rounding is banker's, applied at display only.
 * ========================================================================= */
const money = (() => {
  const isInt = (n) => Number.isInteger(n);

  const add = (...sens) => sens.reduce((a, b) => a + b, 0);
  const subtract = (a, b) => a - b;

  // multiply sen by a scalar (e.g. tax rate). Uses banker's rounding.
  const multiply = (sen, scalar) => bankersRound(sen * scalar);
  // divide sen by an integer divisor; distributes remainder to `remainderTo` (0..divisor-1)
  const divide = (sen, divisor) => bankersRound(sen / divisor);
  const percent = (sen, pctBps /* 0-10000 */) => bankersRound(sen * pctBps / 10000);

  // Banker's / half-to-even rounding for a Number → Integer
  function bankersRound(x) {
    const floor = Math.floor(x);
    const diff  = x - floor;
    if (diff > 0.5) return floor + 1;
    if (diff < 0.5) return floor;
    // exactly .5 → round to even
    return (floor % 2 === 0) ? floor : floor + 1;
  }

  // Split a total into `parts` shares whose sum EXACTLY equals `total_sen`.
  // Any rounding remainder goes into the largest share (or index 0 if all equal).
  function splitExact(total_sen, weights /* e.g. [50, 30, 20] */) {
    const wsum = weights.reduce((a, b) => a + b, 0);
    const raw  = weights.map(w => Math.floor(total_sen * w / wsum));
    const used = raw.reduce((a, b) => a + b, 0);
    let remainder = total_sen - used;
    // Sink remainder into the largest weight (ties → lowest index)
    let biggest = 0;
    for (let i = 1; i < weights.length; i++) if (weights[i] > weights[biggest]) biggest = i;
    raw[biggest] += remainder;
    return raw;
  }

  // Parse "RM 1,234.56" or "1234.56" → sen (integer). Returns null on garbage.
  function parse(str) {
    if (typeof str === 'number') return Math.round(str * 100);
    if (typeof str !== 'string') return null;
    const cleaned = str.replace(/[^\d.\-]/g, '');
    if (cleaned === '' || cleaned === '-' || cleaned === '.') return null;
    const n = Number(cleaned);
    if (!Number.isFinite(n)) return null;
    return Math.round(n * 100);
  }

  // Format sen → "RM 1,234.56" (or other currency w/ locale).
  function format(sen, opts = {}) {
    const { currency = 'MYR', locale = 'en-MY', showSymbol = true } = opts;
    const value = sen / 100; // ONLY at display time
    if (currency === 'MYR' && showSymbol) {
      // Enforce the "RM 1,234.56" house style regardless of locale peculiarities.
      const abs = Math.abs(value).toLocaleString('en-MY', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
      return (value < 0 ? '-RM ' : 'RM ') + abs;
    }
    return value.toLocaleString(locale, {
      style: showSymbol ? 'currency' : 'decimal',
      currency,
      minimumFractionDigits: 2, maximumFractionDigits: 2,
    });
  }

  return { add, subtract, multiply, divide, percent, splitExact, parse, format, bankersRound, isInt };
})();

/* =========================================================================
 * db.js — thin wrapper around the Artifact `db` capability.
 * TODO(capabilities): before first publish, load the `artifact-capabilities`
 * skill and replace these stubs with the real read_db / write_db calls per
 * the current contract. All collection paths live under data/users/me/…
 * ========================================================================= */
const db = (() => {
  const HAS_DB = typeof window !== 'undefined' && !!(window.claude && window.claude.db);

  // In-memory fallback so the skeleton runs in a plain browser preview.
  const mem = new Map(); // key = `${collection}/${doc_id}`

  async function get(collection, doc_id) {
    if (HAS_DB) return window.claude.db.get({ collection, doc_id });   // TODO(capabilities): verify shape
    return mem.get(`${collection}/${doc_id}`) ?? null;
  }
  async function list(collection, { limit = 100, cursor } = {}) {
    if (HAS_DB) return window.claude.db.list({ collection, limit, cursor }); // TODO(capabilities)
    const rows = [];
    for (const [k, v] of mem) {
      if (k.startsWith(collection + '/')) rows.push({ id: k.slice(collection.length + 1), ...v });
    }
    return { rows, next_cursor: null };
  }
  async function set(collection, doc_id, data) {
    if (HAS_DB) return window.claude.db.set({ collection, doc_id, data }); // TODO(capabilities)
    mem.set(`${collection}/${doc_id}`, { ...data });
  }
  async function update(collection, doc_id, patch) {
    if (HAS_DB) return window.claude.db.update({ collection, doc_id, data: patch }); // TODO(capabilities)
    const prev = mem.get(`${collection}/${doc_id}`) ?? {};
    mem.set(`${collection}/${doc_id}`, { ...prev, ...patch });
  }
  async function remove(collection, doc_id) {
    if (HAS_DB) return window.claude.db.delete({ collection, doc_id }); // TODO(capabilities)
    mem.delete(`${collection}/${doc_id}`);
  }

  // Debounced writer — coalesces rapid updates to the same doc.
  const pending = new Map();
  function scheduleWrite(collection, doc_id, patch, ms = 500) {
    const key = `${collection}/${doc_id}`;
    const prev = pending.get(key) ?? { patch: {}, timer: null };
    Object.assign(prev.patch, patch);
    if (prev.timer) clearTimeout(prev.timer);
    prev.timer = setTimeout(() => {
      const p = pending.get(key);
      pending.delete(key);
      update(collection, doc_id, p.patch);
    }, ms);
    pending.set(key, prev);
  }

  return {
    get, list, set, update, remove, scheduleWrite,
    // Collection roots (relative — the artifact capability contract prepends the user subtree)
    PATHS: {
      profile:       'data/users/me/profile',
      accounts:      'data/users/me/accounts',
      categories:    'data/users/me/categories',
      transactions:  'data/users/me/transactions',
      recurring:     'data/users/me/recurring',
      sinking_funds: 'data/users/me/sinking_funds',
      debts:         'data/users/me/debts',
    },
  };
})();

/* =========================================================================
 * App shell — React 18 + hash router (dashboard | txn | funds | debts | settings | debug/math)
 * ========================================================================= */
const { useState, useEffect, useMemo, useReducer, useCallback } = React;
const e = React.createElement;

/**
 * Route is React state (source of truth). We MIRROR to window.location.hash
 * so links + reload keep the route, but we do NOT rely on `hashchange` for
 * navigation — some sandboxed iframes (and same-value assignments) swallow
 * that event, which used to break the sidebar.
 */
function useRoute() {
  const initial = (typeof window !== 'undefined' && window.location.hash.replace(/^#/, '')) || 'dashboard';
  const [route, setRouteState] = useState(initial);

  // External hash changes (Back/Forward, manual URL edit) still sync in.
  useEffect(() => {
    const onChange = () => {
      const h = window.location.hash.replace(/^#/, '') || 'dashboard';
      setRouteState(h);
    };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);

  const setRoute = useCallback((next) => {
    setRouteState(next);
    // Best-effort URL sync. Wrap in try/catch — some hosts throw on hash writes.
    try {
      if (window.location.hash !== '#' + next) window.location.hash = next;
    } catch (_) { /* ignore — state is still authoritative */ }
  }, []);

  return [route, setRoute];
}

// Simple id generator for docs
const uid = (prefix) => prefix + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* =========================================================================
 * Collection hooks: list-shaped state hydrated from db, with add/update/remove.
 * ========================================================================= */
function useCollection(pathKey, seedIfEmpty) {
  const path = db.PATHS[pathKey];
  const [rows, setRows] = useState([]);       // [{id, ...data}]
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const res = await db.list(path, { limit: 500 });
      let list = (res.rows ?? []).map(r => ({ id: r.id, ...r }));
      // Strip the id field that may have been mirrored into data
      list = list.map(({ id, ...rest }) => ({ id, ...rest }));
      if (list.length === 0 && seedIfEmpty) {
        const seeded = await seedIfEmpty();
        if (seeded) list = seeded;
      }
      setRows(list);
      setLoaded(true);
    })();
    // eslint-disable-next-line
  }, [path]);

  const add = useCallback(async (data) => {
    const id = uid(pathKey.slice(0, 3));
    await db.set(path, id, data);
    setRows((r) => [{ id, ...data }, ...r]);
    return id;
  }, [path, pathKey]);

  const update = useCallback(async (id, patch) => {
    await db.update(path, id, patch);
    setRows((r) => r.map(x => x.id === id ? { ...x, ...patch } : x));
  }, [path]);

  const remove = useCallback(async (id) => {
    await db.remove(path, id);
    setRows((r) => r.filter(x => x.id !== id));
  }, [path]);

  const restore = useCallback(async (row) => {
    const { id, ...data } = row;
    await db.set(path, id, data);
    setRows((r) => [row, ...r]);
  }, [path]);

  return { rows, loaded, add, update, remove, restore, setRows };
}

/* =========================================================================
 * Toast + undo system
 * ========================================================================= */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((toast) => {
    const id = uid('t');
    setToasts((ts) => [...ts, { id, ...toast }]);
    const ttl = toast.durationMs ?? 5000;
    setTimeout(() => {
      setToasts((ts) => ts.filter(t => t.id !== id));
    }, ttl);
    return id;
  }, []);
  const dismiss = useCallback((id) => {
    setToasts((ts) => ts.filter(t => t.id !== id));
  }, []);
  return { toasts, push, dismiss };
}

function ToastRegion({ toasts, dismiss }) {
  return e(React.Fragment, null,
    toasts.map(t =>
      e('div', { key: t.id, className: 'toast', role: 'status' },
        t.message,
        t.onUndo && e('button', {
          className: 'undo-btn', type: 'button',
          onClick: () => { t.onUndo(); dismiss(t.id); },
        }, t.undoLabel ?? 'Undo')
      )
    )
  );
}

  const cat = (name) => categoriesByName[name]?.id ?? null;

  // Always emit all 20 entries — spread across the most recent 20 days
  // ending today, so it works whether today is the 1st or the 30th.
  const raw = [
    { merchant: 'Maybank Salary',       category: 'EPF top-up',           account: 'Maybank',      amount_sen:  650000 },
    { merchant: 'Village Grocer',       category: 'Groceries',            account: 'Maybank',      amount_sen: -18450 },

    { merchant: 'Grab',                 category: 'Public Transport',     account: 'TnG eWallet',  amount_sen: -2400  },
    { merchant: 'Starbucks Pavilion',   category: 'Coffee',               account: 'Maybank',      amount_sen: -2350  },
    { merchant: 'TNB',                  category: 'Utilities — TNB',      account: 'Maybank',      amount_sen: -21400 },
    { merchant: 'Air Selangor',         category: 'Water',                account: 'Maybank',      amount_sen: -3800  },
    { merchant: 'Shopee',               category: 'Shopping',             account: 'ShopeePay',    amount_sen: -8990  },
    { merchant: 'SmartTAG top-up',      category: 'Transport — Tolls',    account: 'TnG eWallet',  amount_sen: -5000  },
    { merchant: 'Netflix',              category: 'Subscriptions',        account: 'Maybank',      amount_sen: -5500  },
    { merchant: 'Village Grocer',       category: 'Groceries',            account: 'Maybank',      amount_sen: -15620 },
    { merchant: 'PTPTN',                category: 'PTPTN',                account: 'Maybank',      amount_sen: -30000 },
    { merchant: 'Watsons',              category: 'Personal Care',        account: 'Maybank',      amount_sen: -4780  },
    { merchant: 'KFC Bangsar',          category: 'Dining Out',           account: 'Maybank',      amount_sen: -3450  },
    { merchant: 'ASNB',                 category: 'ASB / ASNB',           account: 'Maybank',      amount_sen: -50000 },
    { merchant: 'Spotify',              category: 'Subscriptions',        account: 'Maybank',      amount_sen: -1490  },
  ];

  // Spread entries across the last N days ending today (N = raw.length).
  // Salary lands on the earliest date so month-to-date income shows the full amount.
  const now = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  return raw.map((r, idx) => {
    const d = new Date(now);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (raw.length - 1 - idx)); // 0 = oldest, last = today
    return {
      date: iso(d),
      account_id:  acc(r.account),
      category_id: cat(r.category),
      amount_sen:  r.amount_sen,
      merchant:    r.merchant,
      notes:       '',
      tags:        ['sample'],
    };
  });
}

function useProfile() {
  const [profile, setProfile] = useState(DEFAULTS.profile);
  useEffect(() => {
    (async () => {
      const stored = await db.get(db.PATHS.profile, 'settings');
      if (stored) setProfile({ ...DEFAULTS.profile, ...stored });
    })();
  }, []);
  const update = useCallback((patch) => {
    setProfile((p) => {
      const next = { ...p, ...patch };
      db.scheduleWrite(db.PATHS.profile, 'settings', patch);
      return next;
    });
  }, []);
  return [profile, update];
}

function useTheme(profile) {
  useEffect(() => {
    const root = document.documentElement;
    if (profile.theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', profile.theme);
  }, [profile.theme]);
}

function Meter({ label, spent_sen, budget_sen, daysLeft, t }) {
  const over = spent_sen > budget_sen;
  const pct = budget_sen > 0 ? Math.min(100, Math.round((spent_sen / budget_sen) * 100)) : 0;
  const remaining_sen = budget_sen - spent_sen;
  return e('div', { className: 'meter' + (over ? ' over' : '') },
    e('div', { className: 'row' },
      e('span', { className: 'lbl' }, label),
      e('span', { className: 'val num' },
        `${money.format(spent_sen)} ${t.dashboard.spent} · ${money.format(Math.max(0, remaining_sen))} ${t.dashboard.remaining} · ${pct}% ${t.dashboard.used}`
      )
    ),
    e('div', { className: 'track' },
      e('div', { className: 'fill', style: { width: pct + '%' } })
    )
  );
}

function computeRange(kind) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = (dt) => dt.toISOString().slice(0, 10);
  if (kind === 'thisMonth') {
    return { from: iso(new Date(y, m, 1)), to: iso(now) };
  }
  if (kind === 'lastMonth') {
    return { from: iso(new Date(y, m - 1, 1)), to: iso(new Date(y, m, 0)) };
  }
  if (kind === 'last3') {
    return { from: iso(new Date(y, m - 3, 1)), to: iso(now) };
  }
  if (kind === 'last12') {
    return { from: iso(new Date(y, m - 12, 1)), to: iso(now) };
  }
  return { from: iso(new Date(y, m, 1)), to: iso(now) };
}

function useExpenseAggregations(transactions, categories, range) {
  return useMemo(() => {
    const catById = Object.fromEntries(categories.map(c => [c.id, c]));
    const { from, to } = range;
    // Only expenses (amount_sen < 0) within the range.
    const inRange = transactions.filter(tx =>
      tx.amount_sen < 0 &&
      tx.date && tx.date >= from && tx.date <= to
    );
    // Aggregate by category
    const byCatMap = new Map();
    let total = 0;
    for (const tx of inRange) {
      const sen = Math.abs(tx.amount_sen);
      total += sen;
      const key = tx.category_id || '__uncat';
      const prev = byCatMap.get(key) ?? { catId: key, sen: 0,
        name: catById[tx.category_id]?.name ?? '—' };
      prev.sen += sen;
      byCatMap.set(key, prev);
    }
    const byCategory = [...byCatMap.values()]
      .map(r => ({ ...r, pct: total > 0 ? (r.sen / total) * 100 : 0 }))
      .sort((a, b) => b.sen - a.sen);

    // Aggregate by merchant
    const byMerchMap = new Map();
    for (const tx of inRange) {
      const name = (tx.merchant || '').trim();
      if (!name) continue;
      byMerchMap.set(name, (byMerchMap.get(name) ?? 0) + Math.abs(tx.amount_sen));
    }
    const topMerchants = [...byMerchMap.entries()]
      .map(([name, sen]) => ({ name, sen }))
      .sort((a, b) => b.sen - a.sen)
      .slice(0, 5);

    return { byCategory, topMerchants, total };
  }, [transactions, categories, range.from, range.to]);
}

/* =========================================================================
 * Debts — simulator + editor + Debts view
 * Both strategies pay every minimum first; leftover budget (freed minimums +
 * user's extra) flows to a focused debt (snowball = smallest balance,
 * avalanche = highest rate). Amounts are integer sen throughout.
 * ========================================================================= */

function simulateDebts(debts, strategy /* 'snowball' | 'avalanche' */, extra_sen) {
  const state = debts.map(d => ({
    id: d.id, name: d.name,
    balance: d.balance_sen ?? 0,
    apr_bps: d.apr_bps ?? 0,
    min:     d.min_payment_sen ?? 0,
    schedule: [],
  }));
  const totalMin = debts.reduce((s, d) => s + (d.min_payment_sen ?? 0), 0);
  const monthlyBudget = totalMin + (extra_sen ?? 0);

  let month = 0, total_interest = 0;
  const MAX_MONTHS = 600;

  while (state.some(d => d.balance > 0) && month < MAX_MONTHS) {
    month++;
    // 1) Accrue interest on every active debt
    for (const d of state) {
      if (d.balance <= 0) { d._m_int = 0; d._m_pay = 0; continue; }
      const int_sen = money.bankersRound(d.balance * (d.apr_bps / 10000) / 12);
      d.balance += int_sen;
      total_interest += int_sen;
      d._m_int = int_sen;
      d._m_pay = 0;
    }

    // 2) Focus order for this month
    const active = state.filter(d => d.balance > 0);
    if (active.length === 0) break;
    const focusOrder = [...active].sort((a, b) =>
      strategy === 'snowball' ? a.balance - b.balance : b.apr_bps - a.apr_bps
    );

    // 3) Pay minimum on each active debt (bounded by remaining balance)
    let budget = monthlyBudget;
    for (const d of active) {
      const pay = Math.min(d.min, d.balance, budget);
      d.balance -= pay;
      budget -= pay;
      d._m_pay += pay;
      if (budget <= 0) break;
    }

    // 4) Apply the remaining budget to the focus debt(s), highest priority first
    for (const d of focusOrder) {
      if (budget <= 0) break;
      if (d.balance <= 0) continue;
      const pay = Math.min(d.balance, budget);
      d.balance -= pay;
      budget -= pay;
      d._m_pay += pay;
    }

    // 5) Record schedule row for each debt that has been active this month
    for (const d of state) {
      if (d._m_pay === 0 && d._m_int === 0) continue;
      d.schedule.push({
        month, interest: d._m_int, payment: d._m_pay, balance: d.balance,
      });
    }

    // Safety: if nothing changed (impossible payments), break to avoid infinite loop
    const allChanged = active.some(d => d._m_pay > 0);
    if (!allChanged) break;
  }

  const debtFree = new Date();
  debtFree.setMonth(debtFree.getMonth() + month);
  return {
    strategy,
    months: month,
    total_interest_sen: total_interest,
    debt_free_iso: debtFree.toISOString().slice(0, 10),
    perDebt: state.map(d => ({ id: d.id, name: d.name, schedule: d.schedule })),
    finished: state.every(d => d.balance <= 0),
  };
}

function Debts({ t, currency, profile, updateProfile, debtsCol, toastPush }) {
  const [editing, setEditing] = useState(null);
  const [extraStr, setExtraStr] = useState('0');
  const extra_sen = Math.max(0, money.parse(extraStr) ?? 0);
  const islamic = !!profile.islamic_mode;

  const totals = useMemo(() => {
    let owed = 0, min = 0;
    for (const d of debtsCol.rows) {
      owed += d.balance_sen ?? 0;
      min  += d.min_payment_sen ?? 0;
    }
    return { owed, min };
  }, [debtsCol.rows]);

  const activeDebts = useMemo(() => debtsCol.rows.filter(d => (d.balance_sen ?? 0) > 0), [debtsCol.rows]);

  const snowball  = useMemo(() => activeDebts.length ? simulateDebts(activeDebts, 'snowball',  extra_sen) : null, [activeDebts, extra_sen]);
  const avalanche = useMemo(() => activeDebts.length ? simulateDebts(activeDebts, 'avalanche', extra_sen) : null, [activeDebts, extra_sen]);

  // Winner = lower total interest. Ties broken by fewer months.
  let winnerKey = null, savings_sen = 0;
  if (snowball && avalanche) {
    if (avalanche.total_interest_sen < snowball.total_interest_sen) {
      winnerKey = 'avalanche';
      savings_sen = snowball.total_interest_sen - avalanche.total_interest_sen;
    } else if (snowball.total_interest_sen < avalanche.total_interest_sen) {
      winnerKey = 'snowball';
      savings_sen = avalanche.total_interest_sen - snowball.total_interest_sen;
    } else if (avalanche.months < snowball.months) {
      winnerKey = 'avalanche';
    } else if (snowball.months < avalanche.months) {
      winnerKey = 'snowball';
    }
  }
  const winning = winnerKey === 'snowball' ? snowball : winnerKey === 'avalanche' ? avalanche : (snowball || avalanche);

  const upsert = async (data) => {
    if (editing === 'new')     await debtsCol.add(data);
    else if (editing)          await debtsCol.update(editing.id, data);
    setEditing(null);
  };
  const del = async (debt) => {
    if (!confirm(t.debts.confirmDelete)) return;
    await debtsCol.remove(debt.id);
    toastPush({
      message: t.debts.deletedToast, undoLabel: t.txn.undo,
      onUndo: () => debtsCol.restore(debt), durationMs: 5000,
    });
  };

  const sym = currencySymbol(currency);
  const isEmpty = debtsCol.rows.length === 0 && !editing;

  const strategyCard = (sim, key, badgeCls, badgeLabel) => e('div', {
    className: 'card elevated strategy-card' + (winnerKey === key ? ' winner' : ''),
    key,
  },
    e('div', { className: 'head' },
      e('span', { className: 'badge ' + badgeCls }, badgeLabel),
      e('h3', { className: 'title' }, t.debts.strat[key]),
      winnerKey === key && e('span', { className: 'winner-pill' }, t.debts.strat.winner),
    ),
    e('div', { className: 'stats' },
      e('div', null,
        e('div', { className: 'k' }, t.debts.strat.debtFree),
        e('div', { className: 'v' }, sim ? formatDate(sim.debt_free_iso) : '—'),
      ),
      e('div', null,
        e('div', { className: 'k' }, ''),
        e('div', { className: 'v' }, sim ? fmt(t.debts.strat.months, { n: sim.months }) : ''),
      ),
      e('div', null,
        e('div', { className: 'k' }, t.debts.strat.totalInterest),
        e('div', { className: 'v' }, sim ? money.format(sim.total_interest_sen, { currency }) : '—'),
      ),
    ),
  );

  return e(React.Fragment, null,
    e('div', { className: 'view-header' },
      e('h2', null, t.debts.title),
      e('div', { className: 'actions' },
        e('div', { className: 'seg-toggle', title: t.debts.islamic.hint, style: { marginRight: 8 } },
          e('button', {
            type: 'button', className: !islamic ? 'active' : '',
            onClick: () => updateProfile({ islamic_mode: false }),
          }, t.debts.editor.apr),
          e('button', {
            type: 'button', className: islamic ? 'active' : '',
            onClick: () => updateProfile({ islamic_mode: true }),
          }, t.debts.editor.profitRate),
        ),
        !editing && !isEmpty && e('button', { type: 'button', onClick: () => setEditing('new') }, t.debts.new),
      ),
    ),

    editing && e(DebtEditor, {
      t, currency, islamic,
      initial: editing === 'new' ? null : editing,
      onCancel: () => setEditing(null), onSave: upsert,
    }),

    isEmpty
      ? e('div', { className: 'card elevated empty' },
          e('svg', { className: 'illus', viewBox: '0 0 96 96', fill: 'none',
                     stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                     'aria-hidden': 'true' },
            e('path', { d: 'M20 40h56v36H20zM28 40V28a20 20 0 0 1 40 0v12' }),
          ),
          e('h3', null, t.debts.empty.title),

function FundIcon({ name, size = 20 }) {
  const d = FUND_ICONS[name] || FUND_ICONS.piggy;
  return e('svg', {
    // Explicit width/height attributes give the SVG intrinsic dimensions,
    // so flex containers (like `.icon-opt`) can't collapse it to 0.
    width: size, height: size,
    viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
    strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
    'aria-hidden': 'true',
    style: { display: 'block', flexShrink: 0 },
  }, e('path', { d }));

function monthsBetween(fromIso, toIso) {
  const f = new Date(fromIso), tt = new Date(toIso);
  if (isNaN(f) || isNaN(tt)) return 0;
  return Math.max(0,
    (tt.getFullYear() - f.getFullYear()) * 12 +
    (tt.getMonth()    - f.getMonth()) +
    (tt.getDate() >= f.getDate() ? 0 : -1)
  );
}

function computeFundState(fund, transactions) {
  const todayIso = new Date().toISOString().slice(0, 10);

  // Manual contributions from the fund doc
  const manualContribs = fund.contributions ?? [];
  const manual_sen = manualContribs.reduce((a, c) => a + (c.amount_sen || 0), 0);

  // Auto contributions from a linked category (savings-bucket transactions).
  // We treat any savings-side transaction (amount_sen < 0) as a contribution.
  let linked_sen = 0;
  let linkedCount = 0;
  if (fund.linked_category_id) {
    for (const tx of transactions) {
      if (tx.category_id !== fund.linked_category_id) continue;
      if (tx.amount_sen >= 0) continue;
      linked_sen += Math.abs(tx.amount_sen);
      linkedCount++;
    }
  }

  const saved_sen  = manual_sen + linked_sen;
  const remaining_sen = Math.max(0, (fund.target_sen ?? 0) - saved_sen);
  const done = saved_sen >= (fund.target_sen ?? 0);

  const months_remaining = fund.target_date ? monthsBetween(todayIso, fund.target_date) : 0;
  const required_monthly_sen = done ? 0 : sinkingRequiredMonthly_sen(remaining_sen, Math.max(1, months_remaining));

  // Progress + expected progress (elapsed / total)
  const total_months = fund.created_at && fund.target_date
    ? Math.max(1, monthsBetween(fund.created_at, fund.target_date))
    : 12;
  const elapsed_months = fund.created_at
    ? Math.max(0, monthsBetween(fund.created_at, todayIso))
    : 0;
  const expected_pct = Math.min(100, (elapsed_months / total_months) * 100);
  const actual_pct = fund.target_sen > 0 ? (saved_sen / fund.target_sen) * 100 : 0;

  let status = 'ontrack';
  if (done) status = 'done';
  else if (actual_pct >= expected_pct + 5) status = 'ahead';
  else if (actual_pct < expected_pct - 5) status = 'behind';

  // Projected completion at current pace
  let projected_iso = null;
  if (!done && elapsed_months > 0 && saved_sen > 0) {
    const monthly_pace = saved_sen / elapsed_months;
    if (monthly_pace > 0) {
      const months_to_go = Math.ceil(remaining_sen / monthly_pace);
      const d = new Date();
      d.setMonth(d.getMonth() + months_to_go);
      projected_iso = d.toISOString().slice(0, 10);
    }
  } else if (done) {
    projected_iso = todayIso;
  }

  return {
    saved_sen, remaining_sen, manual_sen, linked_sen, linkedCount,
    required_monthly_sen, months_remaining,
    actual_pct: Math.min(100, actual_pct), expected_pct,
    status, projected_iso, done,
  };
}
