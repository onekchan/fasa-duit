# FASA Duit — Supabase local dev config.
# `npx supabase start` reads this to boot a local Postgres + Studio + Auth
# stack. Values match Supabase's defaults; adjust only when you know why.

project_id = "fasa-duit"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # local dev only; turn ON in prod dashboard

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false
